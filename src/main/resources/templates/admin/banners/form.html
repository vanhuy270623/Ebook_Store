<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
	<th:block th:replace="~{admin/layout/head :: head}"></th:block>
	<style>
		.image-preview { max-width: 300px; max-height: 200px; margin-top: 10px; display: none; }
	</style>
</head>
<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">
	<div th:replace="~{admin/layout/header :: header}"></div>
	<div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

	<div class="content-wrapper">
		<section class="content-header">
			<h1><span th:if="${isEdit}">Chỉnh sửa banner</span><span th:unless="${isEdit}">Thêm banner mới</span></h1>
			<ol class="breadcrumb">
				<li><a th:href="@{/admin/dashboard}"><i class="fa fa-dashboard"></i> Dashboard</a></li>
				<li><a th:href="@{/admin/banners}">Quản lý banner</a></li>
				<li class="active" th:text="${isEdit} ? 'Chỉnh sửa' : 'Thêm mới'"></li>
			</ol>
		</section>

		<section class="content">
			<div class="row" th:if="${error}">
				<div class="col-md-12">
					<div class="alert alert-danger alert-dismissible">
						<button type="button" class="close" data-dismiss="alert">×</button>
						<span th:text="${error}"></span>
					</div>
				</div>
			</div>

			<form th:action="@{${isEdit ? '/admin/banners/update' : '/admin/banners/create'}}" th:object="${bannerRequest}" method="post" enctype="multipart/form-data">
				<input type="hidden" th:if="${isEdit}" name="bannerId" th:value="${bannerRequest.bannerId}"/>
				<div class="row">
					<div class="col-md-8">
						<div class="box box-primary">
							<div class="box-body">
								<div class="form-group">
									<label for="title">Tiêu đề <span style="color:red;">*</span></label>
									<input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Tiêu đề banner" maxlength="255" required>
								</div>

								<div class="form-group">
									<label for="targetUrl">URL đích</label>
									<input type="url" class="form-control" id="targetUrl" th:field="*{targetUrl}" placeholder="https://..." maxlength="500">
								</div>

								<div class="form-group">
									<label for="position">Vị trí <span style="color:red;">*</span></label>
									<select class="form-control" id="position" th:field="*{position}" required>
										<option value="HOME">Trang chủ (HOME)</option>
										<option value="CATEGORY">Danh mục (CATEGORY)</option>
										<option value="DETAIL">Chi tiết (DETAIL)</option>
									</select>
								</div>

								<div class="form-group">
									<label for="displayOrder">Thứ tự hiển thị</label>
									<input type="number" class="form-control" id="displayOrder" th:field="*{displayOrder}"
									       min="0" max="999" value="0" placeholder="0">
									<small class="text-muted">Số nhỏ hơn sẽ hiển thị trước (1, 2, 3...)</small>
								</div>

								<div class="row">
									<div class="col-md-6">
										<div class="form-group">
											<label for="startDate">Ngày bắt đầu</label>
											<input type="datetime-local" class="form-control" id="startDate" th:field="*{startDate}">
											<small class="text-muted">Để trống = hiển thị ngay</small>
										</div>
									</div>
									<div class="col-md-6">
										<div class="form-group">
											<label for="endDate">Ngày kết thúc</label>
											<input type="datetime-local" class="form-control" id="endDate" th:field="*{endDate}">
											<small class="text-muted">Để trống = không giới hạn</small>
										</div>
									</div>
								</div>

								<div class="form-group">
									<label>
										<input type="checkbox" th:field="*{isActive}" />
										Kích hoạt
									</label>
								</div>
							</div>
						</div>
					</div>

					<div class="col-md-4">
						<div class="box box-info">
							<div class="box-header">
								<h3 class="box-title">Hình ảnh</h3>
							</div>
							<div class="box-body">
								<div th:if="${isEdit && bannerRequest != null && bannerRequest.imageUrl != null && !#strings.isEmpty(bannerRequest.imageUrl)}">
									<img th:src="@{${bannerRequest.imageUrl}}" style="max-width: 100%; margin-bottom: 10px;" alt="Current banner">
									<p class="text-muted text-center">Hình ảnh hiện tại</p>
								</div>

								<div class="form-group">
									<label for="imageFile">Tải lên hình ảnh</label>
									<input type="file" id="imageFile" name="bannerImage" class="form-control" accept="image/*" onchange="previewImage(this)">									<img id="imagePreview" class="image-preview" alt="Preview">
								</div>

								<div class="form-group">
									<label for="imageUrl">Hoặc nhập URL</label>
									<input type="text" class="form-control" id="imageUrl" th:field="*{imageUrl}" maxlength="500" placeholder="/book_asset/image/banners/...">
									<small class="text-muted">Ví dụ: /book_asset/image/banners/banner.jpg</small>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="box-footer">
					<button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Lưu</button>
					<a th:href="@{/admin/banners}" class="btn btn-secondary"><i class="fa fa-times"></i> Hủy</a>
				</div>
			</form>
		</section>
	</div>

	<div th:replace="~{admin/layout/footer :: footer}"></div>
</div>

<th:block th:replace="~{admin/layout/scripts :: scripts}"></th:block>
<!-- Page specific script -->
<script th:src="@{/admin_template/js/admin-common.js}"></script>
</body>
</html>
