<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{admin/layout/head :: head}"></th:block>
	<!-- DataTables CSS -->
	<link rel="stylesheet" href="/admin_template/plugins/datatables/dataTables.bootstrap.min.css">
	<style>
		/* Đảm bảo icon sắp xếp hiển thị cho các cột có thể sắp xếp */
		table.dataTable thead .sorting,
		table.dataTable thead .sorting_asc,
		table.dataTable thead .sorting_desc {
			cursor: pointer;
			position: relative;
		}

		table.dataTable thead .sorting:after,
		table.dataTable thead .sorting_asc:after,
		table.dataTable thead .sorting_desc:after {
			position: absolute;
			bottom: 8px;
			right: 8px;
			display: block;
			font-family: 'Glyphicons Halflings';
			opacity: 0.5;
		}

		table.dataTable thead .sorting:after {
			content: "\e150"; /* icon sort */
			opacity: 0.2;
		}

		table.dataTable thead .sorting_asc:after {
			content: "\e155"; /* icon sort-by-attributes */
		}

		table.dataTable thead .sorting_desc:after {
			content: "\e156"; /* icon sort-by-attributes-alt */
		}

		/* Ẩn icon cho các cột không thể sắp xếp */
		table.dataTable thead th:not(.sorting):not(.sorting_asc):not(.sorting_desc) {
			cursor: default;
		}
	</style>
</head>
<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">
	<!-- Header -->
	<div th:replace="~{admin/layout/header :: header}"></div>

	<!-- Sidebar -->
	<div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

	<!-- Content Wrapper -->
	<div class="content-wrapper">
		<!-- Content Header -->
		<section class="content-header">
			<h1>
				Quản lý sách
				<small>Danh sách tất cả sách trong hệ thống</small>
			</h1>
			<ol class="breadcrumb">
				<li><a th:href="@{/admin/dashboard}"><i class="fa fa-dashboard"></i> Dashboard</a></li>
				<li class="active">Quản lý sách</li>
			</ol>
		</section>

		<!-- Main content -->
		<section class="content">
			<div class="row">
				<div class="col-xs-12">
					<div class="box box-solid">
						<div class="box-body">
							<form method="get" action="/admin/books" class="form-inline">
								<div class="form-group">
									<input type="text" name="search" class="form-control"
										   placeholder="Tìm kiếm..."
										   th:value="${search}" style="width: 300px;">
								</div>
								<button type="submit" class="btn btn-primary"><i class="fa fa-search"></i></button>
								<a th:href="@{/admin/books}" class="btn btn-default"><i class="fa fa-refresh"></i></a>
								<a th:href="@{/admin/books/add}" class="btn btn-success pull-right"><i class="fa fa-plus"></i>Thêm sách mới</a>
							</form>
						</div>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-xs-12">
					<div class="box">
						<div class="box-header">
							<h3 class="box-title">Danh sách sách (<span th:text="${totalBooks}">0</span> cuốn)</h3>
						</div>

						<div class="box-body">
							<table id="booksTable" class="table table-bordered table-striped">
								<thead>
									<tr>
										<th>Ảnh bìa</th>
										<th>Tên sách</th>
										<th>Thể loại</th>
										<th>Giá</th>
										<th>Loại truy cập</th>
										<th>Đánh giá</th>
										<th>Lượt xem</th>
										<th>Ngày tạo</th>
										<th>Thao tác</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="book : ${books}">
										<td>
											<img th:if="${book.coverImageUrl}"
												 th:src="${book.coverImageUrl}"
												 th:alt="${book.title}"
												 class="img-thumbnail"
												 style="width: 50px; height: 70px; object-fit: cover;">
											<div th:unless="${book.coverImageUrl}"
												 class="d-flex align-items-center justify-content-center bg-light"
												 style="width: 50px; height: 70px;">
												<i class="fas fa-book text-muted"></i>
											</div>
										</td>
										<td>
											<strong th:text="${book.title}">Tên sách</strong><br>
											<small class="text-muted" th:text="${book.isbn}">ISBN</small>
										</td>
										<td>
											<span class="label label-info" th:text="${book.bookCategory?.categoryName ?: 'Chưa phân loại'}">Thể loại</span>
										</td>
										<td>
											<span th:if="${book.price == 0}" class="label label-success">Miễn phí</span>
											<span th:if="${book.price > 0}" th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + 'đ'" class="text-primary">0đ</span>
										</td>
										<td>
											<span th:switch="${book.accessType}">
												<span th:case="'FREE'" class="label label-success">Miễn phí</span>
												<span th:case="'PURCHASE'" class="label label-primary">Mua</span>
												<span th:case="'SUBSCRIPTION'" class="label label-warning">Gói đăng ký</span>
												<span th:case="'BOTH'" class="label label-info">Cả hai</span>
											</span>
										</td>
										<td>
											<i class="fa fa-star text-yellow"></i>
											<span th:text="${#numbers.formatDecimal(book.averageRating, 1, 2)}">0.0</span>
											<small class="text-muted">(<span th:text="${book.totalReviews}">0</span>)</small>
										</td>
										<td>
											<span th:text="${#numbers.formatInteger(book.viewCount, 0, 'COMMA')}">0</span>
										</td>
										<td>
											<span th:text="${#temporals.format(book.createdAt, 'dd/MM/yyyy')}">01/01/2024</span>
										</td>
										<td>
											<div class="btn-group">
												<a th:href="@{/admin/books/view/{id}(id=${book.bookId})}"
												   class="btn btn-sm btn-info" title="Xem chi tiết">
													<i class="fa fa-search"></i>
												</a>
											<a th:href="@{/admin/books/edit/{id}(id=${book.bookId})}"
											   class="btn btn-sm btn-warning" title="Chỉnh sửa">
												<i class="fa fa-pencil"></i>
											</a>
											<button class="btn btn-sm btn-success btn-manage-assets" title="Quản lý file"
													th:data-book-id="${book.bookId}">
												<i class="fa fa-file-pdf-o"></i>
											</button>
											<button class="btn btn-sm btn-danger btn-delete-book" title="Xóa sách"
													th:data-book-id="${book.bookId}">
												<i class="fa fa-trash-o"></i>
											</button>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</section>
	</div>

	<!-- Footer -->
	<div th:replace="~{admin/layout/footer :: footer}"></div>
</div>

<!-- Scripts -->
<th:block th:replace="~{admin/layout/scripts :: scripts}"></th:block>
<!-- DataTables -->
<script src="/admin_template/plugins/datatables/jquery.dataTables.min.js"></script>
<script src="/admin_template/plugins/datatables/dataTables.bootstrap.min.js"></script>
<script th:inline="none">
	$(document).ready(function() {
		// Khởi tạo DataTable
		var table = $('#booksTable').DataTable({
			"paging": true,
			"lengthChange": true,
			"searching": false,
			"ordering": true,
			"info": true,
			"autoWidth": false,
			"pageLength": 25,
			"order": [[7, 'desc']], // Sắp xếp mặc định theo ngày tạo giảm dần
			"columnDefs": [
				{
					"orderable": false,
					"targets": [0, 1, 2, 3, 4, 6, 8] // Tắt sắp xếp các cột này
				},
				{
					"orderable": true,
					"targets": [5, 7] // Chỉ bật sắp xếp cho Đánh giá và Ngày tạo
				}
			],
			"language": {
				"url": "//cdn.datatables.net/plug-ins/1.10.25/i18n/Vietnamese.json"
			}
		});

		// Debug: Kiểm tra xem các class đã được apply chưa
		console.log('DataTable initialized');
		$('#booksTable thead th').each(function(index) {
			console.log('Column ' + index + ' classes:', $(this).attr('class'));
		});

		// --- SỬA LẠI PHẦN NÀY ---

		// 1. Bắt sự kiện cho nút XÓA (.btn-delete-book)
		$(document).on('click', '.btn-delete-book', function() {
			var bookId = $(this).data('book-id');
			deleteBook(bookId);
		});

		// 2. Bắt sự kiện cho nút QUẢN LÝ FILE (.btn-manage-assets)
		// Sửa lại logic: Gọi hàm manageBookAssets thay vì deleteBook
		$(document).on('click', '.btn-manage-assets', function() {
			var bookId = $(this).data('book-id');
			manageBookAssets(bookId);
		});
	});

	// Hàm xử lý quản lý file (Placeholder)
	function manageBookAssets(bookId) {
		alert('Chức năng quản lý file sách sẽ được phát triển sau.\nBook ID: ' + bookId);
	}

	// Hàm xử lý xóa sách
	function deleteBook(bookId) {
		if(confirm('Bạn có chắc chắn muốn xóa sách này?\nHành động này không thể hoàn tác!')) {
			// Lấy CSRF token (nếu dùng Spring Security mặc định)
			var token = getCookie('XSRF-TOKEN');
			// Lưu ý: Nếu không dùng Cookie CsrfTokenRepository, bạn có thể cần lấy từ thẻ meta trong <head>

			$.ajax({
				url: '/admin/books/delete/' + bookId, // Đảm bảo URL này khớp với Controller
				type: 'POST',
				xhrFields: {
					withCredentials: true
				},
				headers: {
					'X-XSRF-TOKEN': token,
					'X-Requested-With': 'XMLHttpRequest'
				},
				success: function(response) {
					// Xử lý khi server trả về trang Login HTML (hết session)
					if(typeof response === 'string' && response.includes('<!DOCTYPE html>')) {
						alert('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại!');
						window.location.href = '/auth/login';
						return;
					}

					// Parse JSON nếu cần (thường $.ajax tự parse nếu response header đúng)
					if(typeof response === 'string') {
						try {
							response = JSON.parse(response);
						} catch(e) {
							console.error("Lỗi parse JSON", e);
						}
					}

					if(response && response.success) {
						alert(response.message);
						// Reload lại trang để cập nhật danh sách
						location.reload();
					} else {
						alert('Lỗi: ' + (response && response.message ? response.message : 'Có lỗi xảy ra'));
					}
				},
				error: function(xhr, status, error) {
					// Xử lý lỗi 401, 403...
					if(xhr.status === 401) {
						alert('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại!');
						window.location.href = '/auth/login';
						return;
					}

					var errorMessage = 'Có lỗi xảy ra khi xóa sách!';
					if (xhr.responseJSON && xhr.responseJSON.message) {
						errorMessage = xhr.responseJSON.message;
					} else if (xhr.responseText) {
						// Cố gắng parse message từ response text nếu có
						try {
							var json = JSON.parse(xhr.responseText);
							if(json.message) errorMessage = json.message;
						} catch(e) {}
					}

					alert(errorMessage);
				}
			});
		}
	}

	function getCookie(name) {
		var value = "; " + document.cookie;
		var parts = value.split("; " + name + "=");
		if (parts.length == 2) return parts.pop().split(";").shift();
		return null;
	}
</script>
</body>
</html>
