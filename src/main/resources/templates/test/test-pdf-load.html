<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test PDF Loading</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #result { background: #f5f5f5; padding: 10px; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔍 Test PDF Loading System</h1>

    <div class="test-section">
        <h3>Test 1: Direct File Access</h3>
        <p>Kiểm tra xem có thể truy cập file PDF trực tiếp không</p>
        <input type="text" id="testPath" value="khoahoc-vientuong/Cac The Gioi Song Song - Michio Kaku.pdf" style="width: 500px;">
        <button onclick="testDirectAccess()">Test Direct Access</button>
        <div id="result1" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Test 2: PDF.js Loading</h3>
        <p>Thử load PDF bằng PDF.js</p>
        <button onclick="testPDFJS()">Test PDF.js</button>
        <div id="result2" class="result"></div>
        <canvas id="testCanvas" style="border: 1px solid #000; display: none;"></canvas>
    </div>

    <div class="test-section">
        <h3>Test 3: Authentication Check</h3>
        <p>Kiểm tra authentication</p>
        <button onclick="testAuth()">Test Auth</button>
        <div id="result3" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Test 4: All Paths</h3>
        <p>Thử tất cả các đường dẫn có thể</p>
        <button onclick="testAllPaths()">Test All Paths</button>
        <div id="result4" class="result"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/build/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/build/pdf.worker.min.js';

        async function testDirectAccess() {
            const path = document.getElementById('testPath').value;
            const resultDiv = document.getElementById('result1');
            resultDiv.innerHTML = 'Testing...<br>';

            const paths = [
                `/uploads/source/${path}`,
                `/book_asset/source/${path}`,
                `/source/${path}`,
                `/book_asset/${path}`
            ];

            for (let testPath of paths) {
                try {
                    const response = await fetch(testPath, { method: 'HEAD' });
                    if (response.ok) {
                        resultDiv.innerHTML += `<span class="success">✅ ${testPath} - OK (${response.status})</span><br>`;
                        resultDiv.innerHTML += `Content-Type: ${response.headers.get('content-type')}<br>`;
                        resultDiv.innerHTML += `Content-Length: ${response.headers.get('content-length')} bytes<br><br>`;
                    } else {
                        resultDiv.innerHTML += `<span class="error">❌ ${testPath} - ${response.status} ${response.statusText}</span><br>`;
                    }
                } catch (error) {
                    resultDiv.innerHTML += `<span class="error">❌ ${testPath} - Error: ${error.message}</span><br>`;
                }
            }
        }

        async function testPDFJS() {
            const path = document.getElementById('testPath').value;
            const resultDiv = document.getElementById('result2');
            const canvas = document.getElementById('testCanvas');
            const ctx = canvas.getContext('2d');

            resultDiv.innerHTML = 'Loading with PDF.js...<br>';

            const pdfPath = `/uploads/source/${path}`;

            try {
                const loadingTask = pdfjsLib.getDocument(pdfPath);
                const pdf = await loadingTask.promise;

                resultDiv.innerHTML = `<span class="success">✅ PDF loaded successfully!</span><br>`;
                resultDiv.innerHTML += `Pages: ${pdf.numPages}<br>`;

                // Render first page
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 1.0 });

                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.display = 'block';

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                resultDiv.innerHTML += `<span class="success">✅ First page rendered!</span><br>`;

            } catch (error) {
                resultDiv.innerHTML += `<span class="error">❌ Error: ${error.message}</span><br>`;
                console.error('PDF.js error:', error);
            }
        }

        async function testAuth() {
            const resultDiv = document.getElementById('result3');
            resultDiv.innerHTML = 'Checking authentication...<br>';

            try {
                const response = await fetch('/user/index');
                if (response.ok) {
                    resultDiv.innerHTML += `<span class="success">✅ Authenticated (redirected to: ${response.url})</span><br>`;
                } else if (response.status === 401) {
                    resultDiv.innerHTML += `<span class="error">❌ Not authenticated</span><br>`;
                } else {
                    resultDiv.innerHTML += `<span class="error">❌ Status: ${response.status}</span><br>`;
                }
            } catch (error) {
                resultDiv.innerHTML += `<span class="error">❌ Error: ${error.message}</span><br>`;
            }
        }

        async function testAllPaths() {
            const resultDiv = document.getElementById('result4');
            resultDiv.innerHTML = '<h4>Testing all possible paths...</h4>';

            const basePaths = [
                '/uploads/source/',
                '/book_asset/source/',
                '/source/',
                '/book_asset/'
            ];

            const testFiles = [
                'khoahoc-vientuong/Cac The Gioi Song Song - Michio Kaku.pdf',
                'kienthuc-hocthuat/Bi Quyet Thuyet Trinh Cua Steve - Carmine Gallo.pdf'
            ];

            for (let file of testFiles) {
                resultDiv.innerHTML += `<br><strong>Testing: ${file}</strong><br>`;
                for (let base of basePaths) {
                    const fullPath = base + file;
                    try {
                        const response = await fetch(fullPath, { method: 'HEAD' });
                        if (response.ok) {
                            resultDiv.innerHTML += `<span class="success">✅ ${fullPath}</span><br>`;
                            break; // Found working path
                        } else {
                            resultDiv.innerHTML += `<span class="error">❌ ${fullPath} (${response.status})</span><br>`;
                        }
                    } catch (error) {
                        resultDiv.innerHTML += `<span class="error">❌ ${fullPath} (${error.message})</span><br>`;
                    }
                }
            }
        }
    </script>
</body>
</html>
