<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{user/layout/head :: head}"></th:block>
</head>
<body>
<div th:replace="~{user/layout/navbar :: navbar}"></div>

<div th:if="${success}" th:attr="data-flash-success=${success}" style="display:none;"></div>
<div th:if="${error}" th:attr="data-flash-error=${error}" style="display:none;"></div>
<div th:if="${info}" th:attr="data-flash-info=${info}" style="display:none;"></div>
    <!-- Category Books Content -->
    <section class="section py-5">
        <div class="container">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/user/index}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a href="/books">Sách</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Danh mục</li>
                </ol>
            </nav>

            <div class="mb-4">
                <h1 class="h2 mb-2">
                    <i class="fas fa-folder-open text-primary me-2"></i>
                    Sách theo danh mục
                </h1>
                <p class="text-muted">Tìm thấy <strong th:text="${totalBooks}">0</strong> cuốn sách</p>
            </div>

            <div class="row">
                <!-- Categories Sidebar -->
                <div class="col-lg-3 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white py-3">
                            <h6 class="mb-0">
                                <i class="fas fa-th-list text-primary me-2"></i>
                                Tất cả danh mục
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="list-group">
                                <a th:each="cat : ${categories}"
                                   th:href="@{/books/category/{id}(id=${cat.bookCategoryId})}"
                                   class="list-group-item list-group-item-action"
                                   th:classappend="${categoryId == cat.bookCategoryId} ? 'active'"
                                   th:text="${cat.categoryName}">
                                    Danh mục
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Books Grid -->
                <div class="col-lg-9">
                    <div th:if="${#lists.isEmpty(books)}" class="text-center py-5">
                        <i class="fas fa-folder-open fa-4x text-muted mb-3 opacity-50"></i>
                        <h5 class="text-muted">Chưa có sách trong danh mục này</h5>
                    </div>

                    <div th:if="${!#lists.isEmpty(books)}" class="row g-4">
                        <div th:each="book : ${books}" class="col-lg-4 col-md-6">
                            <a th:href="@{/books/view/{id}(id=${book.bookId})}" class="book-card">
                                <div class="book-cover">
                                    <img th:if="${book.coverImageUrl}"
                                         th:src="${book.coverImageUrl}"
                                         th:alt="${book.title}"
                                         loading="lazy">
                                    <div th:unless="${book.coverImageUrl}"
                                         class="d-flex align-items-center justify-content-center bg-light"
                                         style="height: 300px;">
                                        <i class="fas fa-book fa-3x text-muted"></i>
                                    </div>
                                    <span th:if="${book.accessType == T(stu.datn.ebook_store.entity.Book.AccessType).FREE}" class="book-badge free">Miễn phí</span>
                                    <div class="book-actions">
                                        <button class="action-btn" title="Yêu thích">
                                            <i class="far fa-heart"></i>
                                        </button>
                                        <form th:if="${(book.accessType == T(stu.datn.ebook_store.entity.Book.AccessType).PURCHASE || book.accessType == T(stu.datn.ebook_store.entity.Book.AccessType).BOTH) && !purchasedBookIds.contains(book.bookId)}"
                                              th:action="@{/cart/add/{id}(id=${book.bookId})}"
                                              method="post"
                                              class="d-inline add-to-cart-form">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <input type="hidden" name="redirect" th:value="@{/books/category/{id}(id=${categoryId})}"/>
                                            <button type="submit" class="action-btn" title="Thêm vào giỏ">
                                                <i class="fas fa-cart-plus"></i>
                                            </button>
                                        </form>
                                        <div th:if="${purchasedBookIds.contains(book.bookId)}" class="book-owned-wrapper ms-2">
                                            <span class="book-owned-badge">ĐÃ MUA</span>
                                            <small class="book-owned-tooltip">Bạn đã sở hữu ebook này</small>
                                        </div>
                                    </div>
                                </div>
                                <div class="book-info">
                                    <h3 class="book-title" th:text="${book.title}">Tên sách</h3>
                                    <p class="book-author" th:text="${book.firstAuthorName != null ? book.firstAuthorName : 'Tác giả'}">Tác giả</p>
                                    <div class="book-meta">
                                        <div class="book-rating">
                                            <i class="fas fa-star"></i>
                                            <span th:text="${book.averageRating != null ? #numbers.formatDecimal(book.averageRating, 1, 1) : '0.0'}">0.0</span>
                                        </div>
                                        <div th:if="${book.accessType == T(stu.datn.ebook_store.entity.Book.AccessType).FREE}" class="book-price free">Miễn phí</div>
                                        <div th:if="${book.accessType == T(stu.datn.ebook_store.entity.Book.AccessType).PURCHASE}" class="book-price"
                                             th:text="${book.price != null ? #numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Liên hệ'}">0đ</div>
                                        <div th:if="${book.accessType == T(stu.datn.ebook_store.entity.Book.AccessType).SUBSCRIPTION}" class="book-price">VIP</div>
                                        <div th:if="${book.accessType == T(stu.datn.ebook_store.entity.Book.AccessType).BOTH}" class="book-price"
                                             th:text="${book.price != null ? #numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Liên hệ'}">0đ</div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${totalPages > 1}" aria-label="Category books pagination" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/books/category/{id}(id=${categoryId}, page=${currentPage - 1})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                class="page-item"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/books/category/{id}(id=${categoryId}, page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/books/category/{id}(id=${categoryId}, page=${currentPage + 1})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div th:replace="~{user/layout/footer :: footer}"></div>

    <th:block th:replace="~{user/layout/scripts :: scripts}"></th:block>
    <script th:src="@{/user_template/js/user-main.js}"></script>
    <!-- Giữ JS riêng nếu có -->
    <script th:src="@{/user_template/js/books-common.js}"></script>
</body>
</html>
