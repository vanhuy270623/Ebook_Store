<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EbookStore - Thư viện sách điện tử hàng đầu Việt Nam">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' - EbookStore' : 'EbookStore - Thư viện sách điện tử'}">EbookStore</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" type="image/png" th:href="@{/shared/images/book.png}">

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/user_template/css/bootstrap.min.css}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 CSS (for beautiful alerts) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Tiny Slider CSS -->
    <link rel="stylesheet" th:href="@{/user_template/css/tiny-slider.css}">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/user_template/css/style.css}">
    <link rel="stylesheet" th:href="@{/user_template/css/homepage.css}">
    <link rel="stylesheet" th:href="@{/user_template/css/homepage-animations.css}">
    <link rel="stylesheet" th:href="@{/user_template/css/user-custom.css}">
    <link rel="stylesheet" th:href="@{/user_template/css/books-shared.css}">
    <link rel="stylesheet" th:href="@{/user_template/css/banner-carousel.css}">

    <!-- Toast Animation CSS -->
    <style>
        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }
    </style>
</head>
