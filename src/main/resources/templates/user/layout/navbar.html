<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" th:href="@{/user/index}">
                <i class="fas fa-book-reader me-2"></i>EbookStore
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentPage == 'index' ? 'active' : ''}" th:href="@{/user/index}">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentPage == 'books' ? 'active' : ''}" href="/books">Sách</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentPage == 'categories' ? 'active' : ''}" href="/categories">Danh mục</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentPage == 'subscription' ? 'active' : ''}" href="/subscription/plans">Gói VIP</a>
                    </li>

                    <!-- User Dropdown - Only show when authenticated -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:if="${currentUser != null && currentUser.avatarUrl != null}"
                                 th:src="@{${currentUser.avatarUrl}}"
                                 alt="Avatar"
                                 class="rounded-circle me-2"
                                 style="width: 32px; height: 32px; object-fit: cover;"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                            <i th:if="${currentUser == null || currentUser.avatarUrl == null}"
                               class="fas fa-user-circle me-2"
                               style="font-size: 32px;"></i>
                            <span sec:authentication="principal.fullName">Người dùng</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <a class="dropdown-item" th:classappend="${currentPage == 'dashboard' ? 'active' : ''}" th:href="@{/user/dashboard}">
                                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:classappend="${currentPage == 'profile' ? 'active' : ''}" th:href="@{/user/profile}">
                                    <i class="fas fa-user-edit me-2"></i>Hồ sơ
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:classappend="${currentPage == 'orders' ? 'active' : ''}" th:href="@{/user/orders}">
                                    <i class="fas fa-shopping-bag me-2"></i>Đơn hàng
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:classappend="${currentPage == 'library' ? 'active' : ''}" th:href="@{/user/library}">
                                    <i class="fas fa-book me-2"></i>Thư viện
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:classappend="${currentPage == 'reading-history' ? 'active' : ''}" th:href="@{/user/reading-history}">
                                    <i class="fas fa-history me-2"></i>Lịch sử đọc
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>

                    <!-- Login/Register - Only show when not authenticated -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/auth/login}">
                            <i class="fas fa-sign-in-alt me-1"></i>Đăng nhập
                        </a>
                    </li>

                    <!-- Shopping Cart -->
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="/cart" id="cartLink">
                            <i class="fas fa-shopping-cart"></i>
                            <span id="cartCountBadge"
                                  class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill"
                                  style="display: none; font-size: 10px;"
                                  th:text="${cartItemCount != null && cartItemCount > 0 ? cartItemCount : '0'}"
                                  th:style="${cartItemCount != null && cartItemCount > 0 ? 'display: inline-block; font-size: 10px;' : 'display: none;'}">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
