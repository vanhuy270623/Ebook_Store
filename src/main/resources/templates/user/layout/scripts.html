<div th:fragment="scripts" xmlns:th="http://www.thymeleaf.org">
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- Bootstrap 5 JS -->
        <script th:src="@{/user_template/js/bootstrap.bundle.min.js}"></script>

        <!-- Tiny Slider JS -->
        <script th:src="@{/user_template/js/tiny-slider.js}"></script>

        <!-- Custom JS -->
        <script th:src="@{/user_template/js/main.js}"></script>

        <!-- Toast Notification Script -->
        <script>
            // Toast notification function
            function showToast(message, type = 'success') {
                const toastContainer = document.getElementById('toastContainer');
                if (!toastContainer) {
                    const container = document.createElement('div');
                    container.id = 'toastContainer';
                    container.className = 'position-fixed top-0 end-0 p-3';
                    container.style.zIndex = '9999';
                    document.body.appendChild(container);
                }

                const toastId = 'toast-' + Date.now();
                const iconClass = type === 'success' ? 'fa-check-circle' :
                                 type === 'error' ? 'fa-exclamation-circle' :
                                 'fa-info-circle';
                const bgClass = type === 'success' ? 'bg-success' :
                               type === 'error' ? 'bg-danger' :
                               'bg-info';

                const toastHtml = `
                    <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0"
                         role="alert" aria-live="assertive" aria-atomic="true"
                         style="animation: slideInRight 0.3s ease-out;">
                        <div class="d-flex">
                            <div class="toast-body">
                                <i class="fas ${iconClass} me-2"></i>
                                ${message}
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                    data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                `;

                document.getElementById('toastContainer').insertAdjacentHTML('beforeend', toastHtml);
                const toastElement = document.getElementById(toastId);
                const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
                toast.show();

                toastElement.addEventListener('hidden.bs.toast', function () {
                    toastElement.style.animation = 'slideOutRight 0.3s ease-in';
                    setTimeout(() => toastElement.remove(), 300);
                });
            }

            // Show flash messages on page load
            document.addEventListener('DOMContentLoaded', function() {
                // Success message
                const successElement = document.querySelector('[data-flash-success]');
                if (successElement) {
                    const message = successElement.getAttribute('data-flash-success');
                    showToast(message, 'success');
                }

                // Error message
                const errorElement = document.querySelector('[data-flash-error]');
                if (errorElement) {
                    const message = errorElement.getAttribute('data-flash-error');
                    showToast(message, 'error');
                }

                // Info message
                const infoElement = document.querySelector('[data-flash-info]');
                if (infoElement) {
                    const message = infoElement.getAttribute('data-flash-info');
                    showToast(message, 'info');
                }
            });
        </script>
    </div>
