<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Gói Đăng Ký - EbookStore</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/user_template/css/bootstrap.min.css}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/user_template/css/style.css}">
    <link rel="stylesheet" th:href="@{/user_template/css/user-custom.css}">
    <link rel="stylesheet" th:href="@{/user_template/css/payment.css}">

    
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" th:href="@{/user/index}">
                <i class="fas fa-book-reader me-2"></i>EbookStore
            </a>
        </div>
    </nav>

    <div class="checkout-container">
        <div class="text-center mb-4">
            <h1 class="text-white"><i class="fas fa-shopping-cart"></i> Thanh Toán Gói Đăng Ký</h1>
        </div>

        <!-- Alert Messages -->
        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <!-- Warning if user has active subscription -->
        <div th:if="${hasActiveSubscription}" class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <strong>Cảnh báo:</strong> Bạn đang có gói <span th:text="${currentSubscription.subscription.packageName}"></span> đang hoạt động.
            Nếu đăng ký gói mới, gói cũ sẽ bị hủy.
        </div>

        <div class="row">
            <!-- Left: Subscription Info -->
            <div class="col-lg-7 mb-4">
                <div class="card-custom">
                    <div class="card-header-custom">
                        <h4 class="mb-0"><i class="fas fa-info-circle"></i> Thông Tin Gói</h4>
                    </div>

                    <div th:if="${subscription}">
                        <h3 th:text="${subscription.packageName}">VIP</h3>
                        <p class="text-muted" th:text="${subscription.description}">Mô tả</p>

                        <div class="features-list mt-3">
                            <div class="mb-2"
                                 th:each="feature : ${subscription.featuresList}">
                                <i class="fas fa-check-circle text-success"></i>
                                <span th:text="${feature}">Feature</span>
                            </div>
                            <div class="mb-2">
                                <i class="fas fa-devices text-success"></i>
                                <span th:text="${subscription.maxDevices + ' thiết bị'}">1 thiết bị</span>
                            </div>
                            <div class="mb-2" th:if="${!subscription.hasAds}">
                                <i class="fas fa-ban text-success"></i>
                                <span>Không quảng cáo</span>
                            </div>
                            <div class="mb-2">
                                <i class="fas fa-calendar text-success"></i>
                                <span th:text="${subscription.durationDays == 3650 ? 'Vĩnh viễn' : 'Thời hạn: ' + subscription.durationDays + ' ngày'}">30 ngày</span>
                            </div>
                        </div>

                        <div class="mt-4">
                            <h4>Tổng thanh toán:</h4>
                            <div class="price-display">
                                <span th:text="${#numbers.formatDecimal(subscription.price, 0, 'COMMA', 0, 'POINT')}">0</span>
                                <sup>đ</sup>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Payment Method -->
            <div class="col-lg-5">
                <div class="card-custom">
                    <div class="card-header-custom">
                        <h4 class="mb-0"><i class="fas fa-credit-card"></i> Phương Thức Thanh Toán</h4>
                    </div>

                    <form th:action="@{/payment/subscription/process}" method="post" id="paymentForm">
                        <input type="hidden" name="subscriptionId" th:value="${subscription.subscriptionId}"/>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- VNPay -->
                        <div class="payment-method" onclick="selectPayment('VNPAY')">
                            <div class="d-flex align-items-center">
                                <input type="radio" name="paymentMethod" value="VNPAY" id="vnpay" checked/>
                                <label for="vnpay" class="flex-grow-1 mb-0 ms-3">
                                    <strong>VNPay</strong><br>
                                    <small class="text-muted">Thanh toán qua cổng VNPay</small>
                                </label>
                                <img src="https://stcd02206177151.cloud.edgevnpay.vn/assets/images/logo-icon/logo-primary.svg" alt="VNPay" style="height: 30px;"/>
                            </div>
                        </div>

                        <!-- Bank Transfer -->
                        <div class="payment-method" onclick="selectPayment('BANK_TRANSFER')">
                            <div class="d-flex align-items-center">
                                <input type="radio" name="paymentMethod" value="BANK_TRANSFER" id="bank"/>
                                <label for="bank" class="flex-grow-1 mb-0 ms-3">
                                    <strong>Chuyển khoản ngân hàng</strong><br>
                                    <small class="text-muted">Chuyển khoản trực tiếp</small>
                                </label>
                                <i class="fas fa-university fa-2x text-primary"></i>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-checkout mt-3">
                            <i class="fas fa-lock"></i> Thanh Toán An Toàn
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/subscription/plans}" class="text-muted">
                            <i class="fas fa-arrow-left"></i> Quay lại
                        </a>
                    </div>
                </div>

                <!-- User Info -->
                <div class="card-custom mt-3" sec:authorize="isAuthenticated()">
                    <h6><i class="fas fa-user"></i> Thông tin tài khoản</h6>
                    <p class="mb-1"><strong>Tên:</strong> <span sec:authentication="principal.fullName">User</span></p>
                    <p class="mb-0"><strong>Email:</strong> <span sec:authentication="principal.username">user@email.com</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/user_template/js/bootstrap.bundle.min.js}"></script>
    <script>
        function selectPayment(method) {
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('selected');
            });
            const radio = document.querySelector(`input[value="${method}"]`);
            radio.checked = true;
            radio.closest('.payment-method').classList.add('selected');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const checkedRadio = document.querySelector('input[name="paymentMethod"]:checked');
            if (checkedRadio) {
                checkedRadio.closest('.payment-method').classList.add('selected');
            }
        });
    </script>
</body>
</html>
