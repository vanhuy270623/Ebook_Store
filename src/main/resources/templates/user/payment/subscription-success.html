<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{user/layout/head :: head}"></th:block>
    <!-- CSS riêng cho Payment -->
    <link rel="stylesheet" th:href="@{/user_template/css/payment.css}">
</head>
<body>
    <!-- Navigation -->
    <div th:replace="~{user/layout/navbar :: navbar}"></div>

    <!-- Flash Messages -->
    <div th:if="${success}" th:attr="data-flash-success=${success}" style="display:none;"></div>
    <div th:if="${error}" th:attr="data-flash-error=${error}" style="display:none;"></div>
    <div th:if="${info}" th:attr="data-flash-info=${info}" style="display:none;"></div>

    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>

            <h1 class="success-title">Thanh Toán Thành Công!</h1>

            <p class="lead text-muted">Cảm ơn bạn đã đăng ký gói VIP</p>

            <div th:if="${order}" class="order-info">
                <div class="row">
                    <div class="col-5"><strong>Mã đơn hàng:</strong></div>
                    <div class="col-7" th:text="${order.orderId}">SUB_XXXXX</div>
                </div>
                <div class="row">
                    <div class="col-5"><strong>Gói đăng ký:</strong></div>
                    <div class="col-7" th:text="${order.subscription.packageName}">VIP</div>
                </div>
                <div class="row">
                    <div class="col-5"><strong>Thời hạn:</strong></div>
                    <div class="col-7">
                        <span th:text="${#temporals.format(order.startDate, 'dd/MM/yyyy')}">01/01/2025</span> -
                        <span th:text="${#temporals.format(order.endDate, 'dd/MM/yyyy')}">31/01/2025</span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-5"><strong>Số tiền:</strong></div>
                    <div class="col-7">
                        <span class="text-success fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                    </div>
                </div>
            </div>

            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i>
                Gói của bạn đã được kích hoạt và có thể sử dụng ngay!
            </div>

            <div class="mt-4">
                <a th:href="@{/subscription/my-subscriptions}" class="btn btn-success btn-action">
                    <i class="fas fa-crown"></i> Xem Gói Của Tôi
                </a>
                <a th:href="@{/books}" class="btn btn-primary btn-action">
                    <i class="fas fa-book"></i> Đọc Sách Ngay
                </a>
            </div>

            <div class="mt-3">
                <a th:href="@{/user/index}" class="text-muted">
                    <i class="fas fa-home"></i> Về Trang Chủ
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{user/layout/footer :: footer}"></div>

    <!-- Scripts -->
    <th:block th:replace="~{user/layout/scripts :: scripts}"></th:block>
    <script th:src="@{/user_template/js/user-main.js}"></script>
</body>
</html>
