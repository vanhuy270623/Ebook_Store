<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/user_template/css/reading.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title + ' - EPUB Reader'}">EPUB Reader</title>

    <!-- JSZip Library - Required by ePub.js to unzip EPUB files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- ePub.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

</head>
<body>
    <div class="reader-container">
        <!-- Header với thông tin sách và controls -->
        <div class="reader-header">
            <div class="book-info">
                <img th:src="${book.coverImageUrl != null ? book.coverImageUrl : '/images/default-cover.jpg'}"
                     alt="Book Cover" class="book-cover"
                     onerror="this.src='/images/default-cover.jpg'">
                <div class="book-details">
                    <h3 th:text="${book.title}">Tên Sách</h3>
                    <p th:text="${book.authorNames ?: 'Unknown Author'}">Tác Giả</p>
                </div>
            </div>

            <div class="reader-controls">
                <div class="progress-info">
                    <span id="currentSection">Chương 1</span> •
                    <span id="progressText">0%</span>
                </div>

                <div class="control-group">
                    <button class="btn" id="toggleSidebarBtn" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i> Mục lục
                    </button>
                    <button class="btn" id="settingsBtn" onclick="toggleSettings()">
                        <i class="fas fa-cog"></i> Cài đặt
                    </button>
                    <button class="btn btn-primary" onclick="saveBookmark()">
                        <i class="fas fa-bookmark"></i> Bookmark
                    </button>
                    <a th:href="@{/books/view/{id}(id=${book.bookId})}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Thoát
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Reader -->
        <div class="epub-viewer">
            <!-- Sidebar với Table of Contents -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <i class="fas fa-list"></i> Mục lục
                </div>
                <div class="toc-container" id="tocContainer">
                    <!-- TOC sẽ được load bằng JavaScript -->
                </div>
            </div>

            <!-- Reading Area -->
            <div class="reading-area">
                <div class="loading-overlay" id="loadingOverlay">
                    <div>
                        <i class="fas fa-spinner fa-spin"></i> Đang tải EPUB...
                    </div>
                </div>

                <div class="reading-content">
                    <div id="epub-viewer"></div>

                    <!-- Navigation buttons -->
                    <div class="navigation-controls">
                        <button class="nav-btn nav-prev" id="prevBtn" onclick="previousPage()">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="nav-btn nav-next" id="nextBtn" onclick="nextPage()">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div class="reading-progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="setting-group">
                <label class="setting-label">Cỡ chữ</label>
                <select class="setting-control" id="fontSizeSelect" onchange="changeFontSize(this.value)">
                    <option value="14">Nhỏ (14px)</option>
                    <option value="16" selected>Vừa (16px)</option>
                    <option value="18">Lớn (18px)</option>
                    <option value="20">Rất lớn (20px)</option>
                    <option value="24">Khổng lồ (24px)</option>
                </select>
            </div>

            <div class="setting-group">
                <label class="setting-label">Font chữ</label>
                <select class="setting-control" id="fontFamilySelect" onchange="changeFontFamily(this.value)">
                    <option value="Georgia, serif">Georgia</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Segoe UI', sans-serif" selected>Segoe UI</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans</option>
                </select>
            </div>

            <div class="setting-group">
                <label class="setting-label">Chiều rộng trang</label>
                <select class="setting-control" id="pageWidthSelect" onchange="changePageWidth(this.value)">
                    <option value="600">Hẹp (600px)</option>
                    <option value="800" selected>Vừa (800px)</option>
                    <option value="1000">Rộng (1000px)</option>
                    <option value="100%">Toàn màn hình</option>
                </select>
            </div>

            <div class="setting-group">
                <label class="setting-label">Chế độ</label>
                <button class="btn btn-secondary" id="darkModeBtn" onclick="toggleDarkMode()" style="width: 100%;">
                    <i class="fas fa-moon"></i> Chế độ tối
                </button>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <script th:inline="javascript">
        // Variables from Thymeleaf
        const bookId = /*[[${book.bookId}]]*/ 1;
        const assetPath = /*[[${asset.fileUrl}]]*/ '';
        const initialLocation = /*[[${progress?.lastReadLocation}]]*/ null;

        // ePub.js variables
        let book = null;
        let rendition = null;
        let currentLocation = null;
        let isLoading = true;

        // Track loading attempts
        let loadAttempts = 0;
        const maxAttempts = 50; // 5 seconds max wait

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM loaded, checking ePub.js...');
                initEPUBViewer();
            });
        } else {
            // DOM already loaded
            console.log('DOM already loaded, checking ePub.js...');
            initEPUBViewer();
        }

        function initEPUBViewer() {
            loadAttempts++;

            // Kiểm tra ePub đã load chưa
            if (typeof ePub === 'undefined') {
                if (loadAttempts >= maxAttempts) {
                    console.error('ePub.js failed to load after ' + (maxAttempts * 100) + 'ms');
                    showLoading(false);
                    alert('Lỗi: Không thể tải thư viện ePub.js từ CDN.\n\n' +
                          'Nguyên nhân có thể:\n' +
                          '1. Trình duyệt chặn CDN (Tracking Prevention)\n' +
                          '2. Không có kết nối internet\n' +
                          '3. CDN jsdelivr.net bị chặn\n\n' +
                          'Giải pháp:\n' +
                          '- Tắt Tracking Prevention trong browser\n' +
                          '- Kiểm tra kết nối internet\n' +
                          '- Thử browser khác (Chrome, Firefox)');
                    return;
                }
                console.log('Waiting for ePub.js to load... (attempt ' + loadAttempts + ')');
                setTimeout(initEPUBViewer, 100);
                return;
            }

            console.log('✅ ePub.js loaded successfully after ' + (loadAttempts * 100) + 'ms');
            console.log('ePub object:', ePub);

            try {
                loadEPUB();

                // Auto-save progress every 30 seconds
                setInterval(saveProgress, 30000);
            } catch (error) {
                console.error('Error initializing EPUB viewer:', error);
                showLoading(false);
                alert('Lỗi khởi tạo EPUB viewer: ' + error.message);
            }
        }

        async function loadEPUB() {
            try {
                showLoading(true);

                // assetPath đã chứa full path từ DB: /book_asset/source/...
                const epubPath = assetPath;
                console.log('=== EPUB LOADING DEBUG ===');
                console.log('Asset Path from Thymeleaf:', epubPath);
                console.log('Full URL will be:', window.location.origin + epubPath);

                // Kiểm tra path có hợp lệ không
                if (!epubPath || epubPath.trim() === '') {
                    throw new Error('Đường dẫn file EPUB không hợp lệ (trống)');
                }

                // Test URL trước khi load EPUB
                try {
                    console.log('Testing file accessibility...');
                    const testResponse = await fetch(epubPath, { method: 'HEAD' });
                    console.log('Test HEAD request status:', testResponse.status);
                    console.log('Content-Type:', testResponse.headers.get('content-type'));

                    if (!testResponse.ok) {
                        throw new Error(`File không tồn tại hoặc không truy cập được. HTTP ${testResponse.status}`);
                    }
                } catch (fetchError) {
                    console.error('Fetch test failed:', fetchError);
                    throw new Error('Không thể kết nối đến file EPUB: ' + fetchError.message);
                }

                console.log('File URL test passed, initializing ePub...');

                // Initialize book
                book = ePub(epubPath);
                console.log('Book instance created:', book);

                // Try to open the book explicitly
                console.log('Opening book...');
                try {
                    await book.open(epubPath);
                    console.log('✅ book.open() completed');
                } catch (openErr) {
                    console.warn('⚠️ book.open() failed:', openErr);
                    // Continue anyway, book might be auto-opened
                }

                // Try to access spine to verify book is loaded
                console.log('Verifying book data...');
                try {
                    const spine = await book.loaded.spine;
                    console.log('✅ Spine loaded:', spine.length, 'items');

                    const metadata = await book.loaded.metadata;
                    console.log('✅ Metadata loaded:', metadata.title || 'No title');
                } catch (loadErr) {
                    console.error('❌ Failed to load book data:', loadErr);
                    throw new Error('Không thể tải dữ liệu EPUB: ' + loadErr.message);
                }

                // Create rendition
                const viewerElement = document.getElementById("epub-viewer");
                if (!viewerElement) {
                    throw new Error('Element #epub-viewer không tồn tại');
                }

                console.log('Creating rendition...');
                rendition = book.renderTo("epub-viewer", {
                    width: "100%",
                    height: "100%",
                    spread: "none"
                });
                console.log('Rendition created:', rendition);

                // Load saved location or start from beginning
                let startLocation = null;
                try {
                    if (initialLocation) {
                        const locationData = JSON.parse(initialLocation);
                        if (locationData.cfi) {
                            startLocation = locationData.cfi;
                            console.log('Restoring saved location:', startLocation);
                        }
                    }
                } catch (e) {
                    console.log('No valid saved location, starting from beginning');
                }

                // Display the book
                console.log('Displaying book...');
                console.log('Spine items:', book.spine.items);

                try {
                    // Try with saved location first
                    if (startLocation) {
                        console.log('Trying saved location:', startLocation);
                        await rendition.display(startLocation);
                        console.log('✅ Book displayed with saved location');
                    } else {
                        // Start from beginning - display first spine item explicitly
                        console.log('Starting from beginning');
                        if (book.spine && book.spine.items && book.spine.items.length > 0) {
                            const firstItem = book.spine.items[0];
                            console.log('Displaying first spine item:', firstItem.href);
                            await rendition.display(firstItem.href);
                            console.log('✅ Book displayed from first item');
                        } else {
                            // Fallback to index 0
                            console.log('Using index 0');
                            await rendition.display(0);
                            console.log('✅ Book displayed from index 0');
                        }
                    }
                } catch (displayError) {
                    console.error('❌ Display failed:', displayError);
                    console.log('Trying fallback methods...');

                    // Fallback 1: Try with index 0
                    try {
                        console.log('Fallback 1: display(0)');
                        await rendition.display(0);
                        console.log('✅ Fallback 1 success');
                    } catch (fallback1Error) {
                        console.error('❌ Fallback 1 failed:', fallback1Error);

                        // Fallback 2: Try with first href
                        try {
                            const firstHref = book.spine.items[0].href;
                            console.log('Fallback 2: display(first href):', firstHref);
                            await rendition.display(firstHref);
                            console.log('✅ Fallback 2 success');
                        } catch (fallback2Error) {
                            console.error('❌ All display methods failed');
                            throw new Error('Cannot display book: ' + displayError.message);
                        }
                    }
                }

                // Setup navigation
                setupNavigation();

                // Load table of contents
                await loadTableOfContents();

                showLoading(false);
                isLoading = false;
                console.log('=== EPUB LOADED SUCCESSFULLY ===');

            } catch (error) {
                console.error('❌ Error loading EPUB:', error);
                console.error('Error stack:', error.stack);
                showLoading(false);

                let errorMessage = 'Lỗi khi tải file EPUB:\n\n';
                if (error.message.includes('HTTP 404')) {
                    errorMessage += '❌ File không tồn tại (404)\n\n';
                    errorMessage += 'Kiểm tra:\n';
                    errorMessage += '1. File EPUB có tồn tại trong thư mục uploads?\n';
                    errorMessage += '2. Đường dẫn trong DB có đúng?\n';
                    errorMessage += '3. Path: ' + assetPath;
                } else if (error.message.includes('không truy cập được')) {
                    errorMessage += '❌ Không thể truy cập file\n\n';
                    errorMessage += 'Kiểm tra:\n';
                    errorMessage += '1. Spring Boot static resources config\n';
                    errorMessage += '2. File permissions\n';
                    errorMessage += '3. Path: ' + assetPath;
                } else {
                    errorMessage += error.message;
                }

                alert(errorMessage);
            }
        }

        function setupNavigation() {
            // Navigation events
            rendition.on('relocated', function(location) {
                currentLocation = location;
                updateProgress();
                updateCurrentSection();
            });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName.toLowerCase() === 'input' ||
                    e.target.tagName.toLowerCase() === 'select') return;

                switch(e.key) {
                    case 'ArrowLeft':
                        e.preventDefault();
                        previousPage();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        nextPage();
                        break;
                }
            });

            // Touch/swipe navigation for mobile
            let touchStartX = 0;
            let touchEndX = 0;

            rendition.on('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            });

            rendition.on('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;

                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        nextPage();
                    } else {
                        previousPage();
                    }
                }
            }
        }

        async function loadTableOfContents() {
            try {
                const navigation = await book.loaded.navigation;
                const tocContainer = document.getElementById('tocContainer');
                tocContainer.innerHTML = '';

                navigation.toc.forEach((chapter, index) => {
                    const tocItem = document.createElement('div');
                    tocItem.className = 'toc-item';
                    tocItem.textContent = chapter.label;
                    tocItem.onclick = () => goToChapter(chapter.href);
                    tocContainer.appendChild(tocItem);
                });

            } catch (error) {
                console.error('Error loading table of contents:', error);
            }
        }

        function goToChapter(href) {
            if (rendition) {
                rendition.display(href);
                // Auto-hide sidebar on mobile
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            }
        }

        function previousPage() {
            if (rendition) {
                rendition.prev();
            }
        }

        function nextPage() {
            if (rendition) {
                rendition.next();
            }
        }

        function updateProgress() {
            if (!currentLocation) return;

            const progress = book.locations.percentageFromCfi(currentLocation.start.cfi);
            const progressPercent = Math.round(progress * 100);

            document.getElementById('progressText').textContent = progressPercent + '%';
            document.getElementById('progressBar').style.width = progressPercent + '%';
        }

        function updateCurrentSection() {
            if (!currentLocation || !book.navigation) return;

            // Tìm chapter hiện tại
            book.loaded.navigation.then(navigation => {
                const currentChapter = navigation.toc.find(chapter =>
                    currentLocation.start.href.includes(chapter.href.split('#')[0])
                );

                if (currentChapter) {
                    document.getElementById('currentSection').textContent = currentChapter.label;

                    // Highlight in TOC
                    document.querySelectorAll('.toc-item').forEach(item => {
                        item.classList.remove('active');
                        if (item.textContent === currentChapter.label) {
                            item.classList.add('active');
                        }
                    });
                }
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('toggleSidebarBtn');

            sidebar.classList.toggle('hidden');

            if (sidebar.classList.contains('hidden')) {
                btn.innerHTML = '<i class="fas fa-bars"></i> Hiện mục lục';
            } else {
                btn.innerHTML = '<i class="fas fa-times"></i> Ẩn mục lục';
            }
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function changeFontSize(size) {
            if (rendition) {
                rendition.themes.fontSize(size + 'px');
            }
        }

        function changeFontFamily(family) {
            if (rendition) {
                rendition.themes.font(family);
            }
        }

        function changePageWidth(width) {
            if (rendition) {
                const container = document.getElementById('epub-viewer');
                if (width === '100%') {
                    container.style.maxWidth = '100%';
                } else {
                    container.style.maxWidth = width + 'px';
                    container.style.margin = '0 auto';
                }
                rendition.resize();
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            const btn = document.getElementById('darkModeBtn');

            if (isDark) {
                btn.innerHTML = '<i class="fas fa-sun"></i> Chế độ sáng';
                if (rendition) {
                    rendition.themes.default({
                        'body': {
                            'background': '#1a202c !important',
                            'color': '#e2e8f0 !important'
                        },
                        'p': {
                            'color': '#e2e8f0 !important'
                        }
                    });
                }
            } else {
                btn.innerHTML = '<i class="fas fa-moon"></i> Chế độ tối';
                if (rendition) {
                    rendition.themes.default({
                        'body': {
                            'background': '#ffffff !important',
                            'color': '#333333 !important'
                        },
                        'p': {
                            'color': '#333333 !important'
                        }
                    });
                }
            }

            // Save preference
            fetch('/reading/api/toggle-mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `mode=${isDark ? 'dark' : 'light'}`
            });
        }

        async function saveProgress() {
            if (isLoading || !currentLocation) return;

            try {
                const formData = new FormData();
                formData.append('currentPage', Math.round(book.locations.percentageFromCfi(currentLocation.start.cfi) * 100));
                formData.append('totalPages', 100); // EPUB progress in percentage
                formData.append('bookmarkData', JSON.stringify({
                    cfi: currentLocation.start.cfi,
                    href: currentLocation.start.href,
                    percentage: book.locations.percentageFromCfi(currentLocation.start.cfi)
                }));

                const response = await fetch(`/reading/api/progress/${bookId}`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    console.error('Failed to save progress');
                }
            } catch (error) {
                console.error('Error saving progress:', error);
            }
        }

        function saveBookmark() {
            if (!currentLocation) return;

            const bookmarks = getBookmarks();
            const bookmark = {
                cfi: currentLocation.start.cfi,
                href: currentLocation.start.href,
                timestamp: new Date().toISOString(),
                note: prompt('Ghi chú cho bookmark (tùy chọn):') || '',
                percentage: Math.round(book.locations.percentageFromCfi(currentLocation.start.cfi) * 100)
            };

            bookmarks.push(bookmark);
            localStorage.setItem(`bookmarks_${bookId}`, JSON.stringify(bookmarks));

            alert(`Đã lưu bookmark (${bookmark.percentage}%)`);
        }

        function getBookmarks() {
            try {
                const stored = localStorage.getItem(`bookmarks_${bookId}`);
                return stored ? JSON.parse(stored) : [];
            } catch {
                return [];
            }
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = show ? 'flex' : 'none';
        }

        // Close settings panel when clicking outside
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settingsPanel');
            const btn = document.getElementById('settingsBtn');

            if (!panel.contains(e.target) && !btn.contains(e.target)) {
                panel.style.display = 'none';
            }
        });

        // Save progress when leaving page
        window.addEventListener('beforeunload', saveProgress);

        // Auto-hide sidebar on mobile
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('hidden');
        }
    </script>
</body>
</html>
