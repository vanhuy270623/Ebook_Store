<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" th:href="@{/user_template/css/reading.css}">
    <title th:text="${book.title + ' - EPUB Reader'}">EPUB Reader</title>

    <!-- JSZip Library - Required by ePub.js to unzip EPUB files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- ePub.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
    <div class="reader-container">
        <!-- Header với thông tin sách và controls -->
        <div class="reader-header">
            <div class="book-info">
                <img th:src="${book.coverImageUrl != null ? book.coverImageUrl : '/images/default-cover.jpg'}"
                     alt="Book Cover" class="book-cover"
                     onerror="this.src='/images/default-cover.jpg'">
                <div class="book-details">
                    <h3 th:text="${book.title}">Tên Sách</h3>
                    <p th:text="${book.authorNames ?: 'Unknown Author'}">Tác Giả</p>
                </div>
            </div>

            <div class="reader-controls">
                <div class="progress-info">
                    <span id="currentSection">Chương 1</span> •
                    <span id="progressText">0%</span>
                </div>

                <div class="control-group">
                    <button class="btn" id="toggleSidebarBtn" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i> Mục lục
                    </button>
                    <button class="btn" id="settingsBtn" onclick="toggleSettings()">
                        <i class="fas fa-cog"></i> Cài đặt
                    </button>
                    <button class="btn btn-info" onclick="toggleBookmarksSidebar()" title="Xem bookmarks">
                        <i class="fas fa-bookmark"></i> Bookmarks
                    </button>
                    <button class="btn btn-primary" onclick="saveManualBookmark()" title="Thêm bookmark">
                        <i class="fas fa-plus"></i> Thêm Bookmark
                    </button>
                    <a th:href="@{/books/view/{id}(id=${book.bookId})}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Thoát
                    </a>
                </div>
            </div>
        </div>

        <!-- Bookmarks Sidebar -->
        <div class="bookmarks-sidebar-epub" id="bookmarksSidebar">
            <div class="bookmarks-header">
                <h5><i class="fas fa-bookmark"></i> Bookmarks</h5>
                <button class="btn btn-sm btn-link" onclick="toggleBookmarksSidebar()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="bookmarks-content" id="bookmarksList">
                <p class="text-muted text-center">Đang tải...</p>
            </div>
        </div>

        <!-- Main Reader -->
        <div class="epub-viewer">
            <!-- Sidebar với Table of Contents -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <i class="fas fa-list"></i> Mục lục
                </div>
                <div class="toc-container" id="tocContainer">
                    <!-- TOC sẽ được load bằng JavaScript -->
                </div>
            </div>

            <!-- Reading Area -->
            <div class="reading-area">
                <div class="loading-overlay" id="loadingOverlay">
                    <div>
                        <i class="fas fa-spinner fa-spin"></i> Đang tải EPUB...
                    </div>
                </div>

                <div class="reading-content">
                    <div id="epub-viewer"></div>

                    <!-- Navigation buttons -->
                    <div class="navigation-controls">
                        <button class="nav-btn nav-prev" id="prevBtn" onclick="previousPage()">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="nav-btn nav-next" id="nextBtn" onclick="nextPage()">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div class="reading-progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <!-- Zoom Control - Giống PDF Viewer -->
            <div class="setting-group">
                <label class="setting-label">Zoom</label>
                <div class="zoom-controls">
                    <button class="btn btn-secondary" onclick="zoomOut()" style="flex: 1;">
                        <i class="fas fa-minus"></i>
                    </button>
                    <input type="number" id="zoomInput" class="zoom-input" value="100" min="50" max="300" step="25"
                           onchange="setZoom(this.value)" style="flex: 2; text-align: center;">
                    <span class="progress-info" style="margin: 0 5px;">%</span>
                    <button class="btn btn-secondary" onclick="zoomIn()" style="flex: 1;">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Font chữ</label>
                <select class="setting-control" id="fontFamilySelect" onchange="changeFontFamily(this.value)">
                    <option value="Georgia, serif">Georgia</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Segoe UI', sans-serif" selected>Segoe UI</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans</option>
                </select>
            </div>

            <div class="setting-group">
                <label class="setting-label">Chiều rộng trang</label>
                <select class="setting-control" id="pageWidthSelect" onchange="changePageWidth(this.value)">
                    <option value="600">Hẹp (600px)</option>
                    <option value="800" selected>Vừa (800px)</option>
                    <option value="1000">Rộng (1000px)</option>
                    <option value="100%">Toàn màn hình</option>
                </select>
            </div>

            <div class="setting-group">
                <label class="setting-label">Chế độ</label>
                <button class="btn btn-secondary" id="darkModeBtn" onclick="toggleDarkMode()" style="width: 100%;">
                    <i class="fas fa-moon"></i> Chế độ tối
                </button>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <!-- Data container for Thymeleaf variables -->
    <div id="epub-data"
         th:data-book-id="${book.bookId}"
         th:data-asset-path="${asset.fileUrl}"
         th:data-encoded-location="${encodedLocation}"
         style="display: none;"></div>

    <script>
        // Variables from data attributes (safer for special characters)
        const dataContainer = document.getElementById('epub-data');
        const bookId = dataContainer.dataset.bookId;
        const assetPath = dataContainer.dataset.assetPath;

        // Decode Base64 encoded location
        let initialLocation = null;
        const encodedLocation = dataContainer.dataset.encodedLocation;
        if (encodedLocation && encodedLocation !== 'null' && encodedLocation.trim() !== '') {
            try {
                initialLocation = atob(encodedLocation);
                console.log('Decoded initial location:', initialLocation);
            } catch (e) {
                console.warn('Could not decode location:', e);
            }
        }

        console.log('=== DATA FROM ATTRIBUTES ===');
        console.log('bookId:', bookId);
        console.log('assetPath:', assetPath);
        console.log('initialLocation:', initialLocation);

        // ePub.js variables
        let book = null;
        let rendition = null;
        let currentLocation = null;
        let isLoading = true;

        // Track loading attempts
        let loadAttempts = 0;
        const maxAttempts = 50; // 5 seconds max wait

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM loaded, checking ePub.js...');
                initEPUBViewer();
            });
        } else {
            // DOM already loaded
            console.log('DOM already loaded, checking ePub.js...');
            initEPUBViewer();
        }

        function initEPUBViewer() {
            loadAttempts++;

            // Kiểm tra ePub đã load chưa
            if (typeof ePub === 'undefined') {
                if (loadAttempts >= maxAttempts) {
                    console.error('ePub.js failed to load after ' + (maxAttempts * 100) + 'ms');
                    showLoading(false);
                    alert('Lỗi: Không thể tải thư viện ePub.js từ CDN.\n\n' +
                          'Nguyên nhân có thể:\n' +
                          '1. Trình duyệt chặn CDN (Tracking Prevention)\n' +
                          '2. Không có kết nối internet\n' +
                          '3. CDN jsdelivr.net bị chặn\n\n' +
                          'Giải pháp:\n' +
                          '- Tắt Tracking Prevention trong browser\n' +
                          '- Kiểm tra kết nối internet\n' +
                          '- Thử browser khác (Chrome, Firefox)');
                    return;
                }
                console.log('Waiting for ePub.js to load... (attempt ' + loadAttempts + ')');
                setTimeout(initEPUBViewer, 100);
                return;
            }

            console.log('✅ ePub.js loaded successfully after ' + (loadAttempts * 100) + 'ms');
            console.log('ePub object:', ePub);

            try {
                loadEPUB();

                // Auto-save progress every 30 seconds
                setInterval(saveProgress, 30000);
            } catch (error) {
                console.error('Error initializing EPUB viewer:', error);
                showLoading(false);
                alert('Lỗi khởi tạo EPUB viewer: ' + error.message);
            }
        }

        async function loadEPUB() {
            try {
                showLoading(true);

                // assetPath đã chứa full path từ DB: /book_asset/source/...
                const epubPath = assetPath;
                console.log('=== EPUB LOADING DEBUG ===');
                console.log('Asset Path from Thymeleaf:', epubPath);
                console.log('Full URL will be:', window.location.origin + epubPath);

                // Kiểm tra path có hợp lệ không
                if (!epubPath || epubPath.trim() === '') {
                    throw new Error('Đường dẫn file EPUB không hợp lệ (trống)');
                }

                // Test URL trước khi load EPUB
                try {
                    console.log('Testing file accessibility...');
                    const testResponse = await fetch(epubPath, { method: 'HEAD' });
                    console.log('Test HEAD request status:', testResponse.status);
                    console.log('Content-Type:', testResponse.headers.get('content-type'));

                    if (!testResponse.ok) {
                        throw new Error(`File không tồn tại hoặc không truy cập được. HTTP ${testResponse.status}`);
                    }
                } catch (fetchError) {
                    console.error('Fetch test failed:', fetchError);
                    throw new Error('Không thể kết nối đến file EPUB: ' + fetchError.message);
                }

                console.log('File URL test passed, initializing ePub...');

                // Initialize book
                book = ePub(epubPath);
                console.log('Book instance created:', book);

                // Try to open the book explicitly
                console.log('Opening book...');
                try {
                    await book.open(epubPath);
                    console.log('✅ book.open() completed');
                } catch (openErr) {
                    console.warn('⚠️ book.open() failed:', openErr);
                    // Continue anyway, book might be auto-opened
                }

                // Try to access spine to verify book is loaded
                console.log('Verifying book data...');
                try {
                    const spine = await book.loaded.spine;
                    console.log('✅ Spine loaded:', spine.length, 'items');

                    const metadata = await book.loaded.metadata;
                    console.log('✅ Metadata loaded:', metadata.title || 'No title');
                } catch (loadErr) {
                    console.error('❌ Failed to load book data:', loadErr);
                    throw new Error('Không thể tải dữ liệu EPUB: ' + loadErr.message);
                }

                // Create rendition
                const viewerElement = document.getElementById("epub-viewer");
                if (!viewerElement) {
                    throw new Error('Element #epub-viewer không tồn tại');
                }

                console.log('Creating rendition...');
                rendition = book.renderTo("epub-viewer", {
                    width: "100%",
                    height: "100%",
                    spread: "none",
                    minSpreadWidth: 0,
                    allowScriptedContent: true
                });
                console.log('Rendition created:', rendition);

                // Thêm CSS vào rendition để ngăn overflow trên mobile
                rendition.themes.default({
                    'body': {
                        'overflow-x': 'hidden !important',
                        'max-width': '100% !important',
                        'box-sizing': 'border-box !important'
                    },
                    'img': {
                        'max-width': '100% !important',
                        'height': 'auto !important'
                    },
                    'svg': {
                        'max-width': '100% !important',
                        'height': 'auto !important'
                    },
                    'table': {
                        'max-width': '100% !important',
                        'overflow-x': 'auto !important'
                    },
                    'pre': {
                        'white-space': 'pre-wrap !important',
                        'overflow-x': 'auto !important',
                        'max-width': '100% !important'
                    },
                    '*': {
                        'box-sizing': 'border-box !important'
                    }
                });

                // Load saved location or start from beginning
                let startLocation = null;
                console.log('=== PARSING INITIAL LOCATION ===');
                console.log('Raw initialLocation:', initialLocation);
                console.log('Type:', typeof initialLocation);

                try {
                    if (initialLocation && initialLocation !== 'null' && initialLocation.trim() !== '') {
                        // Thử parse như JSON
                        const locationData = JSON.parse(initialLocation);
                        console.log('Parsed location data:', locationData);
                        if (locationData.cfi) {
                            startLocation = locationData.cfi;
                            console.log('Restoring saved location from CFI:', startLocation);
                        } else if (typeof locationData === 'string' && locationData.startsWith('epubcfi')) {
                            // Trường hợp location là CFI string trực tiếp
                            startLocation = locationData;
                            console.log('Restoring saved location (direct CFI):', startLocation);
                        }
                    }
                } catch (e) {
                    console.log('JSON parse failed, trying as direct CFI:', e.message);
                    // Nếu không parse được JSON, có thể là CFI string trực tiếp
                    if (initialLocation && initialLocation.startsWith('epubcfi')) {
                        startLocation = initialLocation;
                        console.log('Using direct CFI string:', startLocation);
                    } else {
                        console.log('No valid saved location, starting from beginning');
                    }
                }

                // Display the book
                console.log('Displaying book...');
                console.log('Spine items:', book.spine.items);

                try {
                    // Try with saved location first
                    if (startLocation) {
                        console.log('Trying saved location:', startLocation);
                        await rendition.display(startLocation);
                        console.log('✅ Book displayed with saved location');
                    } else {
                        // Start from beginning - display first spine item explicitly
                        console.log('Starting from beginning');
                        if (book.spine && book.spine.items && book.spine.items.length > 0) {
                            const firstItem = book.spine.items[0];
                            console.log('Displaying first spine item:', firstItem.href);
                            await rendition.display(firstItem.href);
                            console.log('✅ Book displayed from first item');
                        } else {
                            // Fallback to index 0
                            console.log('Using index 0');
                            await rendition.display(0);
                            console.log('✅ Book displayed from index 0');
                        }
                    }
                } catch (displayError) {
                    console.error('❌ Display failed:', displayError);
                    console.log('Trying fallback methods...');

                    // Fallback 1: Try with index 0
                    try {
                        console.log('Fallback 1: display(0)');
                        await rendition.display(0);
                        console.log('✅ Fallback 1 success');
                    } catch (fallback1Error) {
                        console.error('❌ Fallback 1 failed:', fallback1Error);

                        // Fallback 2: Try with first href
                        try {
                            const firstHref = book.spine.items[0].href;
                            console.log('Fallback 2: display(first href):', firstHref);
                            await rendition.display(firstHref);
                            console.log('✅ Fallback 2 success');
                        } catch (fallback2Error) {
                            console.error('❌ All display methods failed');
                            throw new Error('Cannot display book: ' + displayError.message);
                        }
                    }
                }

                // Setup navigation
                setupNavigation();

                // Load table of contents
                await loadTableOfContents();

                // Apply default zoom (100%)
                applyZoom();

                showLoading(false);
                isLoading = false;
                console.log('=== EPUB LOADED SUCCESSFULLY ===');

            } catch (error) {
                console.error('❌ Error loading EPUB:', error);
                console.error('Error stack:', error.stack);
                showLoading(false);

                let errorMessage = 'Lỗi khi tải file EPUB:\n\n';
                if (error.message.includes('HTTP 404')) {
                    errorMessage += '❌ File không tồn tại (404)\n\n';
                    errorMessage += 'Kiểm tra:\n';
                    errorMessage += '1. File EPUB có tồn tại trong thư mục uploads?\n';
                    errorMessage += '2. Đường dẫn trong DB có đúng?\n';
                    errorMessage += '3. Path: ' + assetPath;
                } else if (error.message.includes('không truy cập được')) {
                    errorMessage += '❌ Không thể truy cập file\n\n';
                    errorMessage += 'Kiểm tra:\n';
                    errorMessage += '1. Spring Boot static resources config\n';
                    errorMessage += '2. File permissions\n';
                    errorMessage += '3. Path: ' + assetPath;
                } else {
                    errorMessage += error.message;
                }

                alert(errorMessage);
            }
        }

        function setupNavigation() {
            // Navigation events
            rendition.on('relocated', function(location) {
                currentLocation = location;
                updateProgress();
                updateCurrentSection();
            });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName.toLowerCase() === 'input' ||
                    e.target.tagName.toLowerCase() === 'select') return;

                switch(e.key) {
                    case 'ArrowLeft':
                        e.preventDefault();
                        previousPage();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        nextPage();
                        break;
                }
            });

            // Touch/swipe navigation for mobile
            let touchStartX = 0;
            let touchEndX = 0;

            rendition.on('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            });

            rendition.on('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;

                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        nextPage();
                    } else {
                        previousPage();
                    }
                }
            }
        }

        async function loadTableOfContents() {
            try {
                const navigation = await book.loaded.navigation;
                const tocContainer = document.getElementById('tocContainer');
                tocContainer.innerHTML = '';

                navigation.toc.forEach((chapter, index) => {
                    const tocItem = document.createElement('div');
                    tocItem.className = 'toc-item';
                    tocItem.textContent = chapter.label;
                    tocItem.onclick = () => goToChapter(chapter.href);
                    tocContainer.appendChild(tocItem);
                });

            } catch (error) {
                console.error('Error loading table of contents:', error);
            }
        }

        function goToChapter(href) {
            if (rendition) {
                rendition.display(href);
                // Auto-hide sidebar on mobile
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            }
        }

        function previousPage() {
            if (rendition) {
                rendition.prev();
            }
        }

        function nextPage() {
            if (rendition) {
                rendition.next();
            }
        }

        function updateProgress() {
            if (!currentLocation) return;

            const progress = book.locations.percentageFromCfi(currentLocation.start.cfi);
            const progressPercent = Math.round(progress * 100);

            document.getElementById('progressText').textContent = progressPercent + '%';
            document.getElementById('progressBar').style.width = progressPercent + '%';
        }

        function updateCurrentSection() {
            if (!currentLocation || !book.navigation) return;

            // Tìm chapter hiện tại
            book.loaded.navigation.then(navigation => {
                const currentChapter = navigation.toc.find(chapter =>
                    currentLocation.start.href.includes(chapter.href.split('#')[0])
                );

                if (currentChapter) {
                    document.getElementById('currentSection').textContent = currentChapter.label;

                    // Highlight in TOC
                    document.querySelectorAll('.toc-item').forEach(item => {
                        item.classList.remove('active');
                        if (item.textContent === currentChapter.label) {
                            item.classList.add('active');
                        }
                    });
                }
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('toggleSidebarBtn');
            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                // Trên mobile: toggle class 'show'
                sidebar.classList.toggle('show');
                if (sidebar.classList.contains('show')) {
                    btn.innerHTML = '<i class="fas fa-times"></i> Ẩn mục lục';
                } else {
                    btn.innerHTML = '<i class="fas fa-bars"></i> Mục lục';
                }
            } else {
                // Trên desktop: toggle class 'hidden'
                sidebar.classList.toggle('hidden');
                if (sidebar.classList.contains('hidden')) {
                    btn.innerHTML = '<i class="fas fa-bars"></i> Hiện mục lục';
                } else {
                    btn.innerHTML = '<i class="fas fa-times"></i> Ẩn mục lục';
                }
            }
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        // Zoom functions - Thống nhất với PDF viewer
        let currentZoom = 100; // Default 100%
        const baseFontSize = 16; // Base font size in px

        function zoomIn() {
            currentZoom = Math.min(currentZoom + 25, 300); // Max 300%
            document.getElementById('zoomInput').value = currentZoom;
            applyZoom();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 25, 50); // Min 50%
            document.getElementById('zoomInput').value = currentZoom;
            applyZoom();
        }

        function setZoom(zoomPercent) {
            currentZoom = parseInt(zoomPercent);
            currentZoom = Math.max(50, Math.min(currentZoom, 300)); // Clamp 50-300%
            document.getElementById('zoomInput').value = currentZoom;
            applyZoom();
        }

        function applyZoom() {
            if (rendition) {
                const fontSize = Math.round(baseFontSize * (currentZoom / 100));
                rendition.themes.fontSize(fontSize + 'px');
                console.log('Zoom:', currentZoom + '%', 'Font size:', fontSize + 'px');
            }
        }

        function changeFontFamily(family) {
            if (rendition) {
                rendition.themes.font(family);
            }
        }

        function changePageWidth(width) {
            if (rendition) {
                const container = document.getElementById('epub-viewer');
                const readingContent = document.querySelector('.reading-content');
                const isMobile = window.innerWidth <= 768;

                // Reset styles trước
                container.style.cssText = '';

                if (width === '100%') {
                    // Toàn màn hình - lấy chiều rộng thực tế của container cha
                    const availableWidth = readingContent ? readingContent.clientWidth : window.innerWidth;
                    // Trừ padding cho navigation buttons
                    const contentWidth = Math.max(availableWidth - 120, 300);

                    container.style.width = '100%';
                    container.style.maxWidth = 'none';
                    container.style.margin = '0 auto';
                    container.style.padding = '20px 60px'; // Padding cho nút điều hướng
                    container.style.boxSizing = 'border-box';
                    container.style.overflowX = 'hidden';

                    console.log('Fullscreen mode - contentWidth:', contentWidth);

                    // Resize rendition
                    setTimeout(() => {
                        rendition.resize(contentWidth, window.innerHeight - 150);
                    }, 100);
                } else {
                    const targetWidth = isMobile ? '100%' : width + 'px';

                    container.style.width = targetWidth;
                    container.style.maxWidth = targetWidth;
                    container.style.margin = '0 auto';
                    container.style.padding = '20px';
                    container.style.boxSizing = 'border-box';
                    container.style.overflowX = 'hidden';

                    console.log('Fixed width mode:', targetWidth);

                    setTimeout(() => {
                        rendition.resize();
                    }, 100);
                }
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            const btn = document.getElementById('darkModeBtn');

            if (isDark) {
                btn.innerHTML = '<i class="fas fa-sun"></i> Chế độ sáng';
                if (rendition) {
                    // Apply dark theme cho toàn bộ EPUB content
                    rendition.themes.default({
                        'body': {
                            'background': '#2d3748 !important',
                            'background-color': '#2d3748 !important',
                            'color': '#e2e8f0 !important'
                        },
                        'html': {
                            'background': '#2d3748 !important',
                            'background-color': '#2d3748 !important'
                        },
                        'p, div, span, a, li, td, th, h1, h2, h3, h4, h5, h6': {
                            'color': '#e2e8f0 !important'
                        },
                        'a': {
                            'color': '#90cdf4 !important'
                        },
                        'a:visited': {
                            'color': '#b794f4 !important'
                        },
                        '*': {
                            'background-color': 'transparent !important'
                        }
                    });
                }
            } else {
                btn.innerHTML = '<i class="fas fa-moon"></i> Chế độ tối';
                if (rendition) {
                    // Apply light theme cho toàn bộ EPUB content
                    rendition.themes.default({
                        'body': {
                            'background': '#ffffff !important',
                            'background-color': '#ffffff !important',
                            'color': '#333333 !important'
                        },
                        'html': {
                            'background': '#ffffff !important',
                            'background-color': '#ffffff !important'
                        },
                        'p, div, span, a, li, td, th, h1, h2, h3, h4, h5, h6': {
                            'color': '#333333 !important'
                        },
                        'a': {
                            'color': '#2563eb !important'
                        },
                        'a:visited': {
                            'color': '#7c3aed !important'
                        },
                        '*': {
                            'background-color': 'transparent !important'
                        }
                    });
                }
            }

            // Save preference
            fetch('/reading/api/toggle-mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `mode=${isDark ? 'dark' : 'light'}`
            });
        }

        async function saveProgress() {
            if (isLoading || !currentLocation) return;

            try {
                const percentage = book.locations ?
                    Math.round(book.locations.percentageFromCfi(currentLocation.start.cfi) * 100) : 0;

                console.log('=== SAVING EPUB PROGRESS ===');
                console.log('Percentage:', percentage, 'CFI:', currentLocation.start.cfi);

                const formData = new FormData();
                formData.append('currentPage', percentage);
                formData.append('totalPages', 100); // EPUB progress in percentage
                formData.append('bookmarkData', JSON.stringify({
                    cfi: currentLocation.start.cfi,
                    href: currentLocation.start.href,
                    percentage: percentage
                }));

                const response = await fetch(`/reading/api/progress/${bookId}`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: formData
                });

                const responseText = await response.text();
                console.log('Server response:', response.status, responseText);

                if (!response.ok) {
                    console.error('Failed to save progress:', responseText);
                } else {
                    console.log('Progress saved:', percentage + '%');
                }
            } catch (error) {
                console.error('Error saving progress:', error);
            }
        }

        // ========== BOOKMARKS MANAGEMENT FOR EPUB ==========

        // Toggle bookmarks sidebar
        function toggleBookmarksSidebar() {
            const sidebar = document.getElementById('bookmarksSidebar');
            sidebar.classList.toggle('show');

            if (sidebar.classList.contains('show')) {
                loadBookmarks();
            }
        }

        // Load bookmarks from server
        async function loadBookmarks() {
            try {
                const response = await fetch(`/reading/api/bookmarks/${bookId}`, {
                    credentials: 'same-origin'
                });
                if (!response.ok) {
                    throw new Error('Failed to load bookmarks');
                }

                const bookmarks = await response.json();
                displayBookmarks(bookmarks);
            } catch (error) {
                console.error('Error loading bookmarks:', error);
                document.getElementById('bookmarksList').innerHTML = `
                    <p class="text-danger text-center">Lỗi tải bookmarks</p>
                `;
            }
        }

        // Display bookmarks list
        function displayBookmarks(bookmarks) {
            const container = document.getElementById('bookmarksList');

            if (!bookmarks || bookmarks.length === 0) {
                container.innerHTML = `
                    <div class="no-bookmarks">
                        <i class="fas fa-bookmark"></i>
                        <p>Chưa có bookmark nào</p>
                        <small>Nhấn "Thêm Bookmark" để lưu vị trí đọc</small>
                    </div>
                `;
                return;
            }

            // Sort by percentage
            bookmarks.sort((a, b) => (a.percentage || 0) - (b.percentage || 0));

            // Store bookmarks data for click handlers
            window.bookmarksData = {};
            bookmarks.forEach(bm => {
                window.bookmarksData[bm.id] = bm.location;
            });

            container.innerHTML = bookmarks.map(bm => `
                <div class="bookmark-item" onclick="jumpToBookmarkById('${bm.id}')">
                    <div class="bookmark-header">
                        <strong>📖 ${bm.percentage ? bm.percentage.toFixed(1) + '%' : 'Vị trí'}</strong>
                        <button class="bookmark-delete-btn"
                                onclick="deleteBookmark('${bm.id}', event)"
                                title="Xóa bookmark">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    ${bm.note ? `<div class="bookmark-note">"${escapeHtml(bm.note)}"</div>` : ''}
                    <div class="bookmark-meta">
                        <span>${formatBookmarkDate(bm.createdAt)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Jump to bookmark by ID (to avoid HTML escaping issues)
        function jumpToBookmarkById(bookmarkId) {
            const locationData = window.bookmarksData[bookmarkId];
            if (locationData) {
                jumpToBookmark(locationData);
            }
        }

        // Save manual bookmark
        async function saveManualBookmark() {
            if (!currentLocation) {
                alert('❌ Chưa có vị trí đọc hiện tại');
                return;
            }

            const note = prompt('Ghi chú cho bookmark (tùy chọn):');
            if (note === null) return; // User cancelled

            try {
                const percentage = book.locations ?
                    Math.round(book.locations.percentageFromCfi(currentLocation.start.cfi) * 100) : 0;

                const formData = new FormData();
                // Lưu CFI location cho EPUB
                formData.append('location', JSON.stringify({
                    cfi: currentLocation.start.cfi,
                    href: currentLocation.start.href,
                    percentage: percentage
                }));
                formData.append('percentage', percentage);
                formData.append('note', note || '');

                console.log('=== SAVING EPUB BOOKMARK ===');
                console.log('CFI:', currentLocation.start.cfi, 'Percentage:', percentage);

                const response = await fetch(`/reading/api/bookmarks/${bookId}`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: formData
                });

                const responseText = await response.text();
                console.log('Bookmark save response:', response.status, responseText);

                if (!response.ok) {
                    throw new Error('Failed to save bookmark: ' + responseText);
                }

                alert('✅ Bookmark đã lưu!');

                // Reload bookmarks if sidebar is open
                if (document.getElementById('bookmarksSidebar').classList.contains('show')) {
                    loadBookmarks();
                }
            } catch (error) {
                console.error('Error saving bookmark:', error);
                alert('❌ Lỗi khi lưu bookmark: ' + error.message);
            }
        }

        // Jump to bookmark
        async function jumpToBookmark(locationData) {
            try {
                console.log('=== JUMPING TO BOOKMARK ===');
                console.log('Raw locationData:', locationData);
                console.log('Type:', typeof locationData);

                let cfi;

                // Parse location data - có thể là JSON hoặc CFI string trực tiếp
                if (typeof locationData === 'string' && locationData.trim().startsWith('{')) {
                    try {
                        const data = JSON.parse(locationData);
                        console.log('Parsed JSON:', data);
                        cfi = data.cfi;
                    } catch (parseError) {
                        console.error('JSON parse failed:', parseError);
                        // Thử dùng trực tiếp nếu không parse được
                        if (locationData.includes('epubcfi')) {
                            cfi = locationData;
                        }
                    }
                } else if (typeof locationData === 'string' && locationData.includes('epubcfi')) {
                    cfi = locationData;
                } else {
                    cfi = locationData;
                }

                console.log('Final CFI:', cfi);

                if (cfi && rendition) {
                    await rendition.display(cfi);
                    console.log('✅ Jumped to bookmark successfully');
                } else {
                    console.error('Cannot jump: cfi or rendition is null');
                }
            } catch (error) {
                console.error('Error jumping to bookmark:', error);
                alert('❌ Không thể chuyển đến vị trí bookmark');
            }
        }

        // Delete bookmark
        async function deleteBookmark(bookmarkId, event) {
            event.stopPropagation(); // Prevent jump

            if (!confirm('Xóa bookmark này?')) return;

            try {
                console.log('=== DELETING EPUB BOOKMARK ===', bookmarkId);

                const response = await fetch(
                    `/reading/api/bookmarks/${bookId}/${bookmarkId}`,
                    {
                        method: 'DELETE',
                        credentials: 'same-origin'
                    }
                );

                const responseText = await response.text();
                console.log('Delete response:', response.status, responseText);

                if (!response.ok) {
                    throw new Error('Failed to delete bookmark: ' + responseText);
                }

                loadBookmarks();
            } catch (error) {
                console.error('Error deleting bookmark:', error);
                alert('❌ Lỗi khi xóa bookmark: ' + error.message);
            }
        }

        // Helper: Format date
        function formatBookmarkDate(dateString) {
            if (!dateString) return '';

            try {
                const date = new Date(dateString);
                const now = new Date();
                const diff = now - date;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));

                if (days === 0) return 'Hôm nay';
                if (days === 1) return 'Hôm qua';
                if (days < 7) return `${days} ngày trước`;

                return date.toLocaleDateString('vi-VN');
            } catch {
                return '';
            }
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = show ? 'flex' : 'none';
        }

        // Close settings panel when clicking outside
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settingsPanel');
            const btn = document.getElementById('settingsBtn');

            if (!panel.contains(e.target) && !btn.contains(e.target)) {
                panel.style.display = 'none';
            }
        });

        // Save progress when leaving page
        window.addEventListener('beforeunload', saveProgress);

        // Auto-hide sidebar on mobile
        if (window.innerWidth <= 768) {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.add('hidden');
            sidebar.classList.remove('show');
        }

        // Resize rendition when window resizes
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (rendition) {
                    const isMobile = window.innerWidth <= 768;
                    const container = document.getElementById('epub-viewer');

                    // Đảm bảo container không tràn trên mobile
                    if (isMobile) {
                        container.style.maxWidth = '100%';
                        container.style.padding = '10px 5px';
                    } else {
                        const selectedWidth = document.getElementById('pageWidthSelect').value;
                        if (selectedWidth !== '100%') {
                            container.style.maxWidth = selectedWidth + 'px';
                        }
                        container.style.padding = '40px 20px';
                    }

                    container.style.overflowX = 'hidden';
                    rendition.resize();

                    // Auto-hide sidebar trên mobile
                    const sidebar = document.getElementById('sidebar');
                    if (isMobile && sidebar.classList.contains('show')) {
                        // Không tự động ẩn nếu đang hiển thị
                    } else if (isMobile) {
                        sidebar.classList.remove('show');
                    }
                }
            }, 300); // Debounce 300ms
        });
    </script>
</body>
</html>
