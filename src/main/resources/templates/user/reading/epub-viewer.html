﻿<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" th:href="@{/user_template/css/reading.css}">
    <title th:text="${book.title + ' - EPUB Reader'}">EPUB Reader</title>

    <!-- JSZip Library - Required by ePub.js to unzip EPUB files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- ePub.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
<div class="reader-container">
    <!-- Header với thông tin sách và controls -->
    <div class="reader-header">
        <div class="book-info">
            <img th:src="${book.coverImageUrl != null ? book.coverImageUrl : '/images/default-cover.jpg'}"
                 alt="Book Cover" class="book-cover"
                 onerror="this.src='/images/default-cover.jpg'">
            <div class="book-details">
                <h3 th:text="${book.title}">Tên Sách</h3>
                <p th:text="${book.authorNames != null ? book.authorNames : 'Unknown Author'}">Tác Giả</p>
            </div>
        </div>

        <div class="reader-controls">
            <div class="progress-info">
                <span id="currentSection">Chương 1</span> •
                <span id="progressText">0%</span>
            </div>

            <div class="control-group">
                <button class="btn" id="toggleSidebarBtn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i> Mục lục
                </button>
                <button class="btn" id="settingsBtn" onclick="toggleSettings()">
                    <i class="fas fa-cog"></i> Cài đặt
                </button>
                <button class="btn btn-info" onclick="toggleBookmarksSidebar()" title="Xem bookmarks">
                    <i class="fas fa-bookmark"></i> Bookmarks
                </button>
                <button class="btn btn-primary" onclick="saveManualBookmark()" title="Thêm bookmark">
                    <i class="fas fa-plus"></i> Thêm Bookmark
                </button>
                <a th:href="@{/books/view/{id}(id=${book.bookId})}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Thoát
                </a>
            </div>
        </div>
    </div>

    <!-- Bookmarks Sidebar -->
    <div class="bookmarks-sidebar-epub" id="bookmarksSidebar">
        <div class="bookmarks-header">
            <h5><i class="fas fa-bookmark"></i> Bookmarks</h5>
            <button class="btn btn-sm btn-link" onclick="toggleBookmarksSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="bookmarks-content" id="bookmarksList">
            <p class="text-muted text-center">Đang tải...</p>
        </div>
    </div>

    <!-- Main Reader -->
    <div class="epub-viewer">
        <!-- Sidebar với Table of Contents -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-list"></i> Mục lục
            </div>
            <div class="toc-container" id="tocContainer">
                <!-- TOC sẽ được load bằng JavaScript -->
            </div>
        </div>

        <!-- Reading Area -->
        <div class="reading-area">
            <div class="loading-overlay" id="loadingOverlay">
                <div>
                    <i class="fas fa-spinner fa-spin"></i> Đang tải EPUB...
                </div>
            </div>

            <div class="reading-content">
                <div id="epub-viewer"></div>

                <!-- Navigation buttons -->
                <div class="navigation-controls">
                    <button class="nav-btn nav-prev" id="prevBtn" onclick="previousPage()">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="nav-btn nav-next" id="nextBtn" onclick="nextPage()">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <div class="reading-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <!-- Zoom Control - Giống PDF Viewer -->
        <div class="setting-group">
            <label class="setting-label">Zoom</label>
            <div class="zoom-controls">
                <button class="btn btn-secondary" onclick="zoomOut()" style="flex: 1;">
                    <i class="fas fa-minus"></i>
                </button>
                <input type="number" id="zoomInput" class="zoom-input" value="100" min="50" max="300" step="25"
                       onchange="setZoom(this.value)" style="flex: 2; text-align: center;">
                <span class="progress-info" style="margin: 0 5px;">%</span>
                <button class="btn btn-secondary" onclick="zoomIn()" style="flex: 1;">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">Font chữ</label>
            <select class="setting-control" id="fontFamilySelect" onchange="changeFontFamily(this.value)">
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Segoe UI', sans-serif" selected>Segoe UI</option>
                <option value="'Comic Sans MS', cursive">Comic Sans</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">Chiều rộng trang</label>
            <select class="setting-control" id="pageWidthSelect" onchange="changePageWidth(this.value)">
                <option value="600">Hẹp (600px)</option>
                <option value="800" selected>Vừa (800px)</option>
                <option value="1000">Rộng (1000px)</option>
                <option value="100%">Toàn màn hình</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">Chế độ</label>
            <button class="btn btn-secondary" id="darkModeBtn" onclick="toggleDarkMode()" style="width: 100%;">
                <i class="fas fa-moon"></i> Chế độ tối
            </button>
        </div>
    </div>
</div>

<!-- Font Awesome -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<!-- Data container for Thymeleaf variables -->
<div id="epub-data"
     th:data-book-id="${book.bookId}"
     th:data-asset-path="${asset.fileUrl}"
     th:data-encoded-location="${encodedLocation}"
     style="display: none;"></div>

<!-- EPUB Reader Script -->
<script th:src="@{/user_template/js/epub-reader.js}"></script>
