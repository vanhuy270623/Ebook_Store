<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/user_template/css/reading.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title + ' - PDF Reader'}">PDF Reader</title>

    <!-- PDF.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/web/viewer.min.css">

</head>
<body>
    <div class="reader-container">
        <!-- Header với thông tin sách và controls -->
        <div class="reader-header">
            <div class="book-info">
                <img th:src="${book.coverImageUrl != null ? book.coverImageUrl : '/images/default-cover.jpg'}"
                     alt="Book Cover" class="book-cover"
                     onerror="this.src='/images/default-cover.jpg'">
                <div class="book-details">
                    <h3 th:text="${book.title}">Tên Sách</h3>
                    <p th:text="${book.authorNames ?: 'Unknown Author'}">Tác Giả</p>
                </div>
            </div>

            <div class="reader-controls">
                <!-- Page Navigation -->
                <div class="control-group page-navigation">
                    <button class="btn btn-secondary" id="prevPage" onclick="previousPage()">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <input type="number" id="pageInput" class="page-input" value="1" min="1"
                           onchange="goToPage(this.value)">
                    <span class="progress-info">/ <span id="totalPages">1</span></span>
                    <button class="btn btn-secondary" id="nextPage" onclick="nextPage()">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Zoom Controls -->
                <div class="control-group zoom-controls">
                    <button class="btn btn-secondary" onclick="zoomOut()">
                        <i class="fas fa-minus"></i>
                    </button>
                    <input type="number" id="zoomInput" class="zoom-input" value="100" min="25" max="300" step="25"
                           onchange="setZoom(this.value)">
                    <span class="progress-info">%</span>
                    <button class="btn btn-secondary" onclick="zoomIn()">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <!-- Mode & Actions -->
                <div class="control-group">
                    <button class="btn btn-dark" id="darkModeBtn" onclick="toggleDarkMode()">
                        <i class="fas fa-moon"></i> Chế độ tối
                    </button>
                    <button class="btn btn-info" onclick="toggleBookmarksSidebar()">
                        <i class="fas fa-bookmark"></i> Bookmarks
                    </button>
                    <button class="btn btn-primary" onclick="saveManualBookmark()">
                        <i class="fas fa-plus"></i> Thêm Bookmark
                    </button>
                    <a th:href="@{/books/view/{id}(id=${book.bookId})}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Thoát
                    </a>
                </div>
            </div>
        </div>

        <!-- Bookmarks Sidebar -->
        <div class="bookmarks-sidebar" id="bookmarksSidebar">
            <div class="bookmarks-header">
                <h5><i class="fas fa-bookmark"></i> Bookmarks</h5>
                <button class="btn btn-sm btn-link" onclick="toggleBookmarksSidebar()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="bookmarks-content" id="bookmarksList">
                <p class="text-muted text-center">Đang tải...</p>
            </div>
        </div>

        <!-- PDF Viewer -->
        <div class="pdf-viewer">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-content">
                    <i class="fas fa-spinner fa-spin fa-3x mb-3"></i>
                    <h4 id="loadingText">Đang tải PDF...</h4>
                    <div class="progress-container" style="width: 300px; margin: 20px auto;">
                        <div class="progress" style="height: 25px; background-color: #e9ecef;">
                            <div id="loadingProgressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                                 role="progressbar" style="width: 0%; background-color: #007bff;">
                                <span id="loadingPercentage">0%</span>
                            </div>
                        </div>
                    </div>
                    <small id="loadingInfo" class="text-muted">Đang kết nối đến server...</small>
                </div>
            </div>
            <div class="pdf-canvas-container">
                <canvas id="pdfCanvas" class="pdf-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- PDF.js - Thử nhiều CDN để tránh bị chặn -->
    <script>
        // Try multiple CDN sources
        (function() {
            const cdnSources = [
                'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/build/pdf.min.js',
                'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'
            ];

            let currentIndex = 0;

            function tryLoadPDFjs() {
                if (currentIndex >= cdnSources.length) {
                    console.error('All CDN sources failed to load PDF.js');
                    alert('Không thể tải thư viện PDF.js từ bất kỳ CDN nào.\n\n' +
                          'Vui lòng:\n' +
                          '1. Kiểm tra kết nối internet\n' +
                          '2. Tắt Ad Blocker\n' +
                          '3. Tắt VPN/Proxy\n' +
                          '4. Thử lại sau');
                    return;
                }

                const script = document.createElement('script');
                script.src = cdnSources[currentIndex];
                script.async = false;

                script.onload = function() {
                    console.log('✅ PDF.js loaded from:', cdnSources[currentIndex]);
                };

                script.onerror = function() {
                    console.warn('❌ Failed to load from:', cdnSources[currentIndex]);
                    currentIndex++;
                    tryLoadPDFjs();
                };

                document.head.appendChild(script);
            }

            tryLoadPDFjs();
        })();
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <!-- Data container for Thymeleaf variables -->
    <div id="pdf-data"
         th:data-book-id="${book.bookId}"
         th:data-asset-path="${asset.fileUrl}"
         th:data-encoded-location="${encodedLocation}"
         th:data-progress-percentage="${progress?.progressPercentage ?: 0}"
         style="display: none;"></div>

    <script defer>
        // Variables from data attributes (safer for special characters)
        const dataContainer = document.getElementById('pdf-data');
        const bookId = dataContainer.dataset.bookId;
        const assetPath = dataContainer.dataset.assetPath;
        const progressPercentage = parseFloat(dataContainer.dataset.progressPercentage) || 0;

        // Decode Base64 encoded location
        let lastReadLocation = 'page-1';
        const encodedLocation = dataContainer.dataset.encodedLocation;
        if (encodedLocation && encodedLocation !== 'null' && encodedLocation.trim() !== '') {
            try {
                lastReadLocation = atob(encodedLocation);
                console.log('Decoded last location:', lastReadLocation);
            } catch (e) {
                console.warn('Could not decode location:', e);
                lastReadLocation = 'page-1';
            }
        }

        // Parse page number from location (format: "page-X" or just number)
        function parsePageNumber(location) {
            if (!location) return 1;
            // If format is "page-X", extract X
            if (typeof location === 'string' && location.startsWith('page-')) {
                return parseInt(location.split('-')[1]) || 1;
            }
            // If it's already a number
            return parseInt(location) || 1;
        }

        // PDF.js variables
        let pdfDoc = null;
        let pageNum = parsePageNumber(lastReadLocation);
        let pageCount = 0;
        let scale = 1.0;
        let canvas = null;
        let ctx = null;

        // Track loading attempts
        let loadAttempts = 0;
        const maxAttempts = 50; // 5 seconds max wait

        // Initialize when page loads
        function initPDFViewer() {
            loadAttempts++;

            // Kiểm tra pdfjsLib đã load chưa
            if (typeof pdfjsLib === 'undefined') {
                if (loadAttempts >= maxAttempts) {
                    console.error('PDF.js failed to load after ' + (maxAttempts * 100) + 'ms');
                    showLoading(false);
                    alert('Lỗi: Không thể tải thư viện PDF.js từ CDN.\n\n' +
                          'Nguyên nhân có thể:\n' +
                          '1. Trình duyệt chặn CDN (Tracking Prevention)\n' +
                          '2. Không có kết nối internet\n' +
                          '3. CDN cloudflare.com bị chặn\n\n' +
                          'Giải pháp:\n' +
                          '- Tắt Tracking Prevention trong browser\n' +
                          '- Kiểm tra kết nối internet\n' +
                          '- Thử browser khác (Chrome, Firefox)');
                    return;
                }
                console.log('Waiting for PDF.js to load... (attempt ' + loadAttempts + ')');
                setTimeout(initPDFViewer, 100);
                return;
            }

            console.log('✅ PDF.js loaded successfully after ' + (loadAttempts * 100) + 'ms');

            try {
                // Thử các worker CDN tương ứng
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

                canvas = document.getElementById('pdfCanvas');
                ctx = canvas.getContext('2d');

                if (!canvas) {
                    throw new Error('Canvas element not found');
                }

                loadPDF();

                // Auto-save progress every 30 seconds
                setInterval(saveProgress, 30000);
            } catch (error) {
                console.error('Error initializing PDF viewer:', error);
                showLoading(false);
                alert('Lỗi khởi tạo PDF viewer: ' + error.message);
            }
        }

        // Wait for both DOM and PDF.js to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM loaded, starting PDF.js check...');
                initPDFViewer();
            });
        } else {
            // DOM already loaded
            console.log('DOM already loaded, starting PDF.js check...');
            initPDFViewer();
        }

        async function loadPDF() {
            try {
                showLoading(true);
                updateLoadingProgress(0, 'Đang kết nối...');

                // assetPath đã chứa full path từ DB: /book_asset/source/...
                const pdfPath = assetPath;
                console.log('=== PDF LOADING DEBUG ===');
                console.log('Asset Path from Thymeleaf:', pdfPath);
                console.log('Full URL will be:', window.location.origin + pdfPath);

                // Test URL trước khi load PDF
                try {
                    const testResponse = await fetch(pdfPath, { method: 'HEAD' });
                    console.log('Test HEAD request status:', testResponse.status);
                    console.log('Test HEAD headers:', [...testResponse.headers.entries()]);

                    if (!testResponse.ok) {
                        throw new Error(`File không tồn tại hoặc không truy cập được. HTTP ${testResponse.status}`);
                    }
                } catch (fetchError) {
                    console.error('Fetch test failed:', fetchError);
                    throw new Error('Không thể kết nối đến file PDF: ' + fetchError.message);
                }

                console.log('File URL test passed, loading PDF...');

                // Tạo loading task với progress callback
                const loadingTask = pdfjsLib.getDocument({
                    url: pdfPath,
                    // Tối ưu: Load từng chunk thay vì toàn bộ file
                    disableAutoFetch: false,
                    disableStream: false,
                    // Tăng timeout cho file lớn
                    httpHeaders: {
                        'Cache-Control': 'no-cache'
                    }
                });

                // Progress callback
                loadingTask.onProgress = function(progressData) {
                    if (progressData.total > 0) {
                        const percent = Math.round((progressData.loaded / progressData.total) * 100);
                        const loadedMB = (progressData.loaded / (1024 * 1024)).toFixed(2);
                        const totalMB = (progressData.total / (1024 * 1024)).toFixed(2);
                        updateLoadingProgress(percent, `Đang tải: ${loadedMB}MB / ${totalMB}MB`);
                        console.log(`Loading progress: ${percent}% (${loadedMB}MB / ${totalMB}MB)`);
                    }
                };

                updateLoadingProgress(10, 'Đang tải file PDF...');

                // Load PDF document
                pdfDoc = await loadingTask.promise;
                pageCount = pdfDoc.numPages;

                updateLoadingProgress(80, `PDF đã tải: ${pageCount} trang`);
                console.log('PDF loaded successfully:', pageCount, 'pages');

                document.getElementById('totalPages').textContent = pageCount;
                document.getElementById('pageInput').max = pageCount;

                updateLoadingProgress(90, 'Đang render trang đầu tiên...');

                // Render trang đầu tiên
                await renderPage(pageNum);

                updateLoadingProgress(100, 'Hoàn thành!');

                // Test API authentication ngay khi load
                try {
                    const testResponse = await fetch('/reading/api/test', { credentials: 'same-origin' });
                    const testData = await testResponse.text();
                    console.log('=== API AUTH TEST ===');
                    console.log('Response:', testData);
                } catch (e) {
                    console.error('API test failed:', e);
                }

                // Delay một chút để user thấy 100%
                setTimeout(() => {
                    showLoading(false);
                }, 300);

            } catch (error) {
                console.error('=== PDF LOADING ERROR ===');
                console.error('Error name:', error.name);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);
                console.error('Asset path was:', assetPath);

                showLoading(false);

                let errorMessage = 'Lỗi khi tải file PDF. ';
                if (error.message) {
                    errorMessage += error.message;
                }

                // Kiểm tra các lỗi phổ biến
                if (error.name === 'MissingPDFException') {
                    errorMessage = 'File PDF không tồn tại hoặc đường dẫn không đúng.\n\nPath: ' + assetPath;
                } else if (error.name === 'UnexpectedResponseException') {
                    errorMessage = 'Server không phản hồi hoặc file bị lỗi.\n\nPath: ' + assetPath + '\n\nVui lòng kiểm tra:\n1. File có tồn tại trên server?\n2. WebMvcConfig có mapping đúng?\n3. File có readable permissions?';
                } else if (error.name === 'InvalidPDFException') {
                    errorMessage = 'File PDF bị hỏng hoặc không hợp lệ.';
                }

                alert(errorMessage + '\n\nChi tiết kỹ thuật:\n' + error.toString());
            }
        }

        function updateLoadingProgress(percent, message) {
            const progressBar = document.getElementById('loadingProgressBar');
            const percentageText = document.getElementById('loadingPercentage');
            const loadingInfo = document.getElementById('loadingInfo');
            const loadingText = document.getElementById('loadingText');

            if (progressBar) {
                progressBar.style.width = percent + '%';
                progressBar.setAttribute('aria-valuenow', percent);
            }
            if (percentageText) {
                percentageText.textContent = percent + '%';
            }
            if (loadingInfo && message) {
                loadingInfo.textContent = message;
            }
            if (loadingText && percent < 100) {
                loadingText.textContent = 'Đang tải PDF...';
            } else if (loadingText) {
                loadingText.textContent = 'Sẵn sàng đọc!';
            }
        }

        async function renderPage(num) {
            if (!pdfDoc) {
                console.error('PDF document not loaded yet');
                return;
            }

            try {
                console.log('Rendering page:', num);
                const renderStart = Date.now();

                // Show mini loading indicator
                canvas.style.opacity = '0.5';

                const page = await pdfDoc.getPage(num);

                // Tính scale phù hợp với màn hình nếu chưa zoom
                let renderScale = scale;
                if (scale === 1.0) {
                    const container = document.querySelector('.pdf-canvas-container');
                    const containerWidth = container.clientWidth - 40; // padding
                    const pageViewport = page.getViewport({ scale: 1.0 });
                    renderScale = Math.min(containerWidth / pageViewport.width, 2.0);
                }

                const viewport = page.getViewport({ scale: renderScale });

                // Set canvas size với device pixel ratio để hiển thị sắc nét hơn
                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = Math.floor(viewport.width) + 'px';
                canvas.style.height = Math.floor(viewport.height) + 'px';

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport,
                    transform: transform
                };

                await page.render(renderContext).promise;

                // Restore opacity
                canvas.style.opacity = '1';

                const renderTime = Date.now() - renderStart;
                console.log(`Page ${num} rendered in ${renderTime}ms`);

                // Update UI
                document.getElementById('pageInput').value = num;
                pageNum = num;
                scale = renderScale;

                // Save progress (debounced)
                if (window.saveProgressTimeout) {
                    clearTimeout(window.saveProgressTimeout);
                }
                window.saveProgressTimeout = setTimeout(() => {
                    saveProgress();
                }, 2000);

            } catch (error) {
                console.error('Error rendering page:', error);
                canvas.style.opacity = '1';
                alert('Lỗi khi hiển thị trang ' + num + ': ' + error.message);
            }
        }

        function previousPage() {
            if (pageNum > 1) {
                renderPage(pageNum - 1);
            }
        }

        function nextPage() {
            if (pageNum < pageCount) {
                renderPage(pageNum + 1);
            }
        }

        function goToPage(page) {
            const pageNumber = parseInt(page);
            if (pageNumber >= 1 && pageNumber <= pageCount) {
                renderPage(pageNumber);
            } else {
                document.getElementById('pageInput').value = pageNum;
            }
        }

        function zoomIn() {
            scale = Math.min(scale * 1.25, 3.0);
            document.getElementById('zoomInput').value = Math.round(scale * 100);
            renderPage(pageNum);
        }

        function zoomOut() {
            scale = Math.max(scale * 0.8, 0.25);
            document.getElementById('zoomInput').value = Math.round(scale * 100);
            renderPage(pageNum);
        }

        function setZoom(zoomPercent) {
            scale = parseInt(zoomPercent) / 100;
            scale = Math.max(0.25, Math.min(scale, 3.0));
            renderPage(pageNum);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            const btn = document.getElementById('darkModeBtn');

            if (isDark) {
                btn.innerHTML = '<i class="fas fa-sun"></i> Chế độ sáng';
                console.log('✅ Dark mode enabled for PDF viewer');
            } else {
                btn.innerHTML = '<i class="fas fa-moon"></i> Chế độ tối';
                console.log('✅ Light mode enabled for PDF viewer');
            }

            // Save preference
            fetch('/reading/api/toggle-mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `mode=${isDark ? 'dark' : 'light'}`
            }).catch(error => {
                console.warn('Could not save dark mode preference:', error);
            });
        }

        async function saveProgress() {
            try {
                console.log('=== SAVING PROGRESS ===');
                console.log('Sending: currentPage=' + pageNum + ', totalPages=' + pageCount + ', bookId=' + bookId);

                const formData = new FormData();
                formData.append('currentPage', pageNum);
                formData.append('totalPages', pageCount);

                const response = await fetch(`/reading/api/progress/${bookId}`, {
                    method: 'POST',
                    credentials: 'same-origin', // Đảm bảo gửi session cookie
                    body: formData
                });

                const responseText = await response.text();
                console.log('Server response status:', response.status);
                console.log('Server response body:', responseText);

                if (!response.ok) {
                    console.error('Failed to save progress:', responseText);
                } else {
                    try {
                        const data = JSON.parse(responseText);
                        console.log('Progress saved successfully - page:', pageNum, ', percentage:', data.percentage + '%');
                    } catch (e) {
                        console.log('Progress saved: page', pageNum);
                    }
                }
            } catch (error) {
                console.error('Error saving progress:', error);
            }
        }

        // ========== BOOKMARKS MANAGEMENT ==========

        // Toggle bookmarks sidebar
        function toggleBookmarksSidebar() {
            const sidebar = document.getElementById('bookmarksSidebar');
            sidebar.classList.toggle('show');

            // Load bookmarks when opening
            if (sidebar.classList.contains('show')) {
                loadBookmarks();
            }
        }

        // Load bookmarks from server
        async function loadBookmarks() {
            try {
                const response = await fetch(`/reading/api/bookmarks/${bookId}`, {
                    credentials: 'same-origin'
                });
                if (!response.ok) {
                    throw new Error('Failed to load bookmarks');
                }

                const bookmarks = await response.json();
                displayBookmarks(bookmarks);
            } catch (error) {
                console.error('Error loading bookmarks:', error);
                document.getElementById('bookmarksList').innerHTML = `
                    <p class="text-danger text-center">Lỗi tải bookmarks</p>
                `;
            }
        }

        // Display bookmarks list
        function displayBookmarks(bookmarks) {
            const container = document.getElementById('bookmarksList');

            if (!bookmarks || bookmarks.length === 0) {
                container.innerHTML = `
                    <div class="no-bookmarks">
                        <i class="fas fa-bookmark"></i>
                        <p>Chưa có bookmark nào</p>
                        <small>Nhấn "Thêm Bookmark" để lưu vị trí đọc</small>
                    </div>
                `;
                return;
            }

            // Sort by page number
            bookmarks.sort((a, b) => (a.pageNumber || 0) - (b.pageNumber || 0));

            // Store bookmarks data for click handlers (avoid escaping issues)
            window.bookmarksData = {};
            bookmarks.forEach(bm => {
                window.bookmarksData[bm.id] = bm.location;
            });

            container.innerHTML = bookmarks.map(bm => `
                <div class="bookmark-item" onclick="jumpToBookmarkById('${bm.id}')">
                    <div class="bookmark-header">
                        <strong>📖 Trang ${bm.pageNumber || '?'}</strong>
                        <button class="bookmark-delete-btn"
                                onclick="deleteBookmark('${bm.id}', event)"
                                title="Xóa bookmark">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    ${bm.note ? `<div class="bookmark-note">"${escapeHtml(bm.note)}"</div>` : ''}
                    <div class="bookmark-meta">
                        <span>${bm.percentage ? bm.percentage.toFixed(1) + '%' : ''}</span>
                        <span>${formatBookmarkDate(bm.createdAt)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Save manual bookmark
        async function saveManualBookmark() {
            const note = prompt('Ghi chú cho bookmark (tùy chọn):');
            if (note === null) return; // User cancelled

            try {
                const formData = new FormData();
                formData.append('location', `page-${pageNum}`);
                formData.append('pageNumber', pageNum);
                formData.append('percentage', ((pageNum / pageCount) * 100).toFixed(2));
                formData.append('note', note || '');

                console.log('=== SAVING BOOKMARK ===');
                console.log('Location:', `page-${pageNum}`, 'Note:', note);

                const response = await fetch(`/reading/api/bookmarks/${bookId}`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: formData
                });

                const responseText = await response.text();
                console.log('Bookmark save response:', response.status, responseText);

                if (!response.ok) {
                    throw new Error('Failed to save bookmark: ' + responseText);
                }

                alert('✅ Bookmark đã lưu!');

                // Reload bookmarks if sidebar is open
                if (document.getElementById('bookmarksSidebar').classList.contains('show')) {
                    loadBookmarks();
                }
            } catch (error) {
                console.error('Error saving bookmark:', error);
                alert('❌ Lỗi khi lưu bookmark: ' + error.message);
            }
        }

        // Jump to bookmark by ID (to avoid escaping issues)
        function jumpToBookmarkById(bookmarkId) {
            const location = window.bookmarksData[bookmarkId];
            if (location) {
                jumpToBookmark(location);
            }
        }

        // Jump to bookmark
        function jumpToBookmark(location) {
            console.log('Jumping to bookmark location:', location);
            const pageNumber = parseInt(location.split('-')[1]);
            if (pageNumber && pageNumber >= 1 && pageNumber <= pageCount) {
                renderPage(pageNumber);

                // Optional: Close sidebar after jump
                // document.getElementById('bookmarksSidebar').classList.remove('show');
            }
        }

        // Delete bookmark
        async function deleteBookmark(bookmarkId, event) {
            event.stopPropagation(); // Prevent jump

            if (!confirm('Xóa bookmark này?')) return;

            try {
                console.log('=== DELETING BOOKMARK ===', bookmarkId);

                const response = await fetch(
                    `/reading/api/bookmarks/${bookId}/${bookmarkId}`,
                    {
                        method: 'DELETE',
                        credentials: 'same-origin'
                    }
                );

                const responseText = await response.text();
                console.log('Delete bookmark response:', response.status, responseText);

                if (!response.ok) {
                    throw new Error('Failed to delete bookmark: ' + responseText);
                }

                // Reload bookmarks
                loadBookmarks();
            } catch (error) {
                console.error('Error deleting bookmark:', error);
                alert('❌ Lỗi khi xóa bookmark: ' + error.message);
            }
        }

        // Helper: Format date
        function formatBookmarkDate(dateString) {
            if (!dateString) return '';

            try {
                const date = new Date(dateString);
                const now = new Date();
                const diff = now - date;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));

                if (days === 0) return 'Hôm nay';
                if (days === 1) return 'Hôm qua';
                if (days < 7) return `${days} ngày trước`;

                return date.toLocaleDateString('vi-VN');
            } catch {
                return '';
            }
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.add('show');
            } else {
                overlay.classList.remove('show');
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName.toLowerCase() === 'input') return;

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousPage();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextPage();
                    break;
                case 'Home':
                    e.preventDefault();
                    goToPage(1);
                    break;
                case 'End':
                    e.preventDefault();
                    goToPage(pageCount);
                    break;
                case '=':
                case '+':
                    e.preventDefault();
                    zoomIn();
                    break;
                case '-':
                    e.preventDefault();
                    zoomOut();
                    break;
            }
        });

        // Save progress when leaving page
        window.addEventListener('beforeunload', saveProgress);
    </script>
</body>
</html>
